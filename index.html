<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synetelas AI Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .message-animate { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 h-screen flex flex-col">

    <div class="bg-blue-700 p-4 text-white flex items-center shadow-lg">
        <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center mr-3">
            <i class="fa-solid fa-robot text-xl"></i>
        </div>
        <div>
            <h1 class="font-bold text-sm">Ψηφιακός Βοηθός</h1>
            <p class="text-xs text-blue-100">Συνεταιρισμός Αστυνομικών</p>
        </div>
    </div>

    <div id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-4 custom-scroll">
        <div class="bg-white p-3 rounded-2xl rounded-tl-none shadow-sm max-w-[80%] text-sm border border-slate-100">
            Γεια σας! Είμαι ο βοηθός του Synetelas. Πώς μπορώ να σας βοηθήσω σήμερα;
        </div>
    </div>

    <div id="buttons-area" class="px-4 py-2 flex flex-wrap gap-2"></div>

    <div class="p-4 bg-white border-t border-slate-200">
        <div class="flex gap-2">
            <input type="text" id="user-input" placeholder="Γράψτε το μήνυμά σας..." 
                class="flex-1 p-3 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
            <button onclick="sendMessage()" class="bg-blue-600 text-white w-12 h-12 rounded-xl hover:bg-blue-700 transition flex items-center justify-center">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <script>
        const sessionId = "session_" + Math.random().toString(36).substr(2, 9);
        const chatBox = document.getElementById('chat-box');
        const buttonsArea = document.getElementById('buttons-area');

        async function sendMessage(customText = null) {
            const input = document.getElementById('user-input');
            const message = customText || input.value;
            if (!message) return;

            appendMessage('user', message);
            input.value = '';
            buttonsArea.innerHTML = ''; // Καθαρισμός κουμπιών

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message, session_id: sessionId })
                });
                const data = await response.json();
                
                appendMessage('bot', data.text);
                
                // Δημιουργία κουμπιών αν υπάρχουν uiOptions
                if (data.uiOptions && data.uiOptions.buttons) {
                    data.uiOptions.buttons.forEach(btn => {
                        const b = document.createElement('button');
                        b.className = "bg-blue-50 text-blue-700 px-4 py-2 rounded-full border border-blue-200 text-xs font-bold hover:bg-blue-600 hover:text-white transition";
                        b.innerText = btn.label;
                        b.onclick = () => sendMessage(btn.target);
                        buttonsArea.appendChild(b);
                    });
                }
            } catch (e) {
                appendMessage('bot', "⚠️ Πρόβλημα σύνδεσης με τον διακομιστή.");
            }
        }

        function appendMessage(sender, text) {
            const div = document.createElement('div');
            div.className = sender === 'user' 
                ? "bg-blue-600 text-white p-3 rounded-2xl rounded-tr-none ml-auto max-w-[80%] text-sm shadow-md message-animate"
                : "bg-white p-3 rounded-2xl rounded-tl-none mr-auto max-w-[80%] text-sm shadow-sm border border-slate-100 message-animate";
            div.innerText = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
