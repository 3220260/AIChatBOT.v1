<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Chatbot - Εξυπηρέτηση Πελατών</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="chat-header">
            <div class="header-content">
                <div class="header-left">
                    <div class="bot-avatar">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM12 5C13.66 5 15 6.34 15 8C15 9.66 13.66 11 12 11C10.34 11 9 9.66 9 8C9 6.34 10.34 5 12 5ZM12 19.2C9.5 19.2 7.29 17.92 6 15.98C6.03 13.99 10 12.9 12 12.9C13.99 12.9 17.97 13.99 18 15.98C16.71 17.92 14.5 19.2 12 19.2Z" fill="currentColor"/>
                        </svg>
                    </div>
                    <div class="header-info">
                        <h1>Chatbot Εξυπηρέτησης</h1>
                        <p class="status">
                            <span class="status-dot"></span>
                            Online
                        </p>
                    </div>
                </div>
                <div class="header-right">
        <div class="efficiency-badge" onclick="closeChat()" style="cursor: pointer;" role="button" tabindex="0">
            Χ
        </div>
    </div>
                </div>
            </div>
        </header>

        <div class="chat-container">
            <div class="chat-messages" id="chat-messages">
                <!-- Τα μηνύματα θα προστίθενται εδώ δυναμικά -->
            </div>

            <div class="chat-input-container">
                <div class="input-wrapper">
                    <textarea 
                        id="user-input" 
                        placeholder="Γράψτε το μήνυμά σας..." 
                        rows="1"
                    ></textarea>
                    <button id="send-button" class="send-button">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M2.01 21L23 12L2.01 3L2 10L17 12L2 14L2.01 21Z" fill="currentColor"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <footer class="chat-footer">
            <div class="stats-container" id="stats">
                <div class="stat">
                    <span class="stat-label">FAQ Απαντήσεις:</span>
                    <span class="stat-value">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">AI Απαντήσεις:</span>
                    <span class="stat-value">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Εξοικονόμηση:</span>
                    <span class="stat-value">0%</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Tokens Εξοικ.:</span>
                    <span class="stat-value">~0</span>
                </div>
            </div>
            <div class="footer-note">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>Powered by Smart FAQ System + Gemini AI</span>
            </div>
        </footer>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
