<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d0d">
  <title>Sofia</title>
  <style>
    :root {
      --bg: #0d0d0d;
      --surface: #171717;
      --surface-2: #1f1f1f;
      --surface-3: #2a2a2a;
      --border: #2f2f2f;
      --text: #ececec;
      --muted: #a3a3a3;
      --accent: #10a37f;
      --danger: #e85b5b;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --visual-height: 100dvh;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overscroll-behavior: none;
    }

    body {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }

    button,
    textarea {
      font: inherit;
      color: inherit;
      -webkit-appearance: none;
      appearance: none;
    }

    .chat-shell {
      position: relative;
      display: grid;
      grid-template-rows: auto 1fr auto;
      width: 100%;
      height: 100vh;
      height: var(--visual-height);
      background: var(--bg);
    }

    .chat-header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: calc(10px + var(--safe-top)) max(14px, var(--safe-right)) 10px max(14px, var(--safe-left));
      border-bottom: 1px solid var(--border);
      background: rgba(13, 13, 13, 0.86);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .header-copy {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.94rem;
      font-weight: 640;
      letter-spacing: 0.01em;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      flex: 0 0 auto;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 0 3px rgba(16, 163, 127, 0.25);
    }

    .header-actions {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex: 0 0 auto;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: #c4c4c4;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.18s ease, color 0.18s ease;
    }

    .icon-btn:hover {
      background: var(--surface-2);
      color: #ffffff;
    }

    .messages-wrap {
      min-height: 0;
      position: relative;
      overflow: hidden;
    }

    .messages {
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 20px max(14px, var(--safe-right)) 18px max(14px, var(--safe-left));
      scroll-behavior: smooth;
    }

    .messages::-webkit-scrollbar {
      width: 10px;
    }

    .messages::-webkit-scrollbar-thumb {
      background: #2c2c2c;
      border-radius: 999px;
      border: 2px solid transparent;
      background-clip: padding-box;
    }

    .messages > * {
      width: min(100%, 860px);
      margin-left: auto;
      margin-right: auto;
    }

    .welcome {
      padding-top: 6vh;
      padding-bottom: 12px;
    }

    .welcome h1 {
      margin: 0;
      font-size: clamp(1.2rem, 2.8vw, 1.75rem);
      line-height: 1.2;
      font-weight: 650;
      color: #f4f4f4;
      text-align: center;
    }

    .welcome p {
      margin: 10px auto 0;
      max-width: 640px;
      font-size: 0.94rem;
      line-height: 1.55;
      color: var(--muted);
      text-align: center;
    }

    .quick-prompts {
      margin-top: 24px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .prompt-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: #e9e9e9;
      border-radius: 14px;
      padding: 12px;
      text-align: left;
      font-size: 0.9rem;
      line-height: 1.45;
      cursor: pointer;
      transition: border-color 0.18s ease, background 0.18s ease;
    }

    .prompt-btn:hover {
      background: #1d1d1d;
      border-color: #3f3f3f;
    }

    .message-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 0 0 18px;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .message-row.assistant {
      justify-content: flex-start;
    }

    .avatar {
      width: 28px;
      height: 28px;
      flex: 0 0 auto;
      border-radius: 8px;
      border: 1px solid #3a3a3a;
      background: linear-gradient(145deg, #2d2d2d, #1c1c1c);
      color: #e7e7e7;
      font-size: 0.83rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 3px;
    }

    .bubble {
      max-width: min(720px, calc(100vw - 64px));
      border-radius: 16px;
      border: 1px solid var(--border);
      padding: 12px 14px;
      font-size: 0.95rem;
      line-height: 1.58;
      white-space: normal;
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    .message-row.user .bubble {
      border-color: #3a3a3a;
      background: #303030;
      color: #ffffff;
      border-top-right-radius: 8px;
    }

    .message-row.assistant .bubble {
      background: var(--surface);
      color: var(--text);
      border-top-left-radius: 8px;
    }

    .bubble p {
      margin: 0;
    }

    .bubble p + p {
      margin-top: 10px;
    }

    .bubble ul,
    .bubble ol {
      margin: 8px 0;
      padding-left: 20px;
    }

    .bubble li + li {
      margin-top: 4px;
    }

    .bubble code {
      font-family: "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: 0.88em;
      border-radius: 8px;
      background: #232323;
      border: 1px solid #333;
      padding: 2px 6px;
    }

    .bubble pre {
      margin: 8px 0;
      padding: 12px;
      overflow: auto;
      border-radius: 10px;
      border: 1px solid #333;
      background: #141414;
    }

    .bubble pre code {
      border: 0;
      background: transparent;
      padding: 0;
    }

    .typing {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 16px;
    }

    .typing span {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: #8d8d8d;
      animation: pulse 1s infinite ease-in-out;
    }

    .typing span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .typing span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes pulse {
      0%,
      100% {
        opacity: 0.3;
        transform: translateY(0);
      }
      50% {
        opacity: 1;
        transform: translateY(-2px);
      }
    }

    .scroll-btn {
      position: absolute;
      right: max(16px, var(--safe-right));
      bottom: calc(94px + var(--safe-bottom));
      width: 36px;
      height: 36px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      color: #d7d7d7;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      transform: translateY(8px);
      transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s ease;
    }

    .scroll-btn.show {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .composer-wrap {
      position: sticky;
      bottom: 0;
      z-index: 25;
      padding: 10px max(12px, var(--safe-right)) calc(10px + var(--safe-bottom)) max(12px, var(--safe-left));
      background: linear-gradient(180deg, rgba(13, 13, 13, 0) 0%, rgba(13, 13, 13, 0.9) 24%, #0d0d0d 100%);
    }

    .composer {
      width: min(100%, 860px);
      margin: 0 auto;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: var(--surface-2);
      padding: 10px 12px 8px;
      display: grid;
      gap: 8px;
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.35);
    }

    #chatInput {
      width: 100%;
      min-height: 28px;
      max-height: min(36vh, 220px);
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: #ffffff;
      caret-color: #ffffff;
      padding: 2px 0;
      font-size: 16px;
      line-height: 1.45;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
    }

    #chatInput::placeholder {
      color: #a3a3a3;
    }

    .composer-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 0.76rem;
    }

    .hint {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .composer-actions {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }

    .counter {
      color: #8f8f8f;
      font-variant-numeric: tabular-nums;
    }

    .counter.warn {
      color: #f59e0b;
    }

    .send-btn {
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 999px;
      background: #ffffff;
      color: #151515;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.18s ease, opacity 0.18s ease;
      flex: 0 0 auto;
    }

    .send-btn:hover {
      transform: translateY(-1px);
    }

    .send-btn:disabled {
      opacity: 0.42;
      cursor: not-allowed;
      transform: none;
    }

    .send-btn .stop-icon {
      display: none;
    }

    .send-btn.is-stopping .send-icon {
      display: none;
    }

    .send-btn.is-stopping .stop-icon {
      display: block;
    }

    .toast {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: calc(94px + var(--safe-bottom));
      z-index: 30;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid #3b3b3b;
      background: rgba(26, 26, 26, 0.96);
      color: #ededed;
      font-size: 0.82rem;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease, visibility 0.2s ease;
      max-width: min(92vw, 520px);
      text-align: center;
    }

    .toast.show {
      opacity: 1;
      visibility: visible;
    }

    .minimized-launcher {
      position: fixed;
      right: max(12px, var(--safe-right));
      bottom: calc(10px + var(--safe-bottom));
      z-index: 40;
      border: 1px solid #3a3a3a;
      border-radius: 999px;
      background: #1c1c1c;
      color: #f5f5f5;
      padding: 10px 14px;
      display: none;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
    }

    .minimized-launcher .dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 0 3px rgba(16, 163, 127, 0.2);
    }

    body.is-minimized .chat-shell {
      display: none;
    }

    body.is-minimized .minimized-launcher {
      display: inline-flex;
    }

    @media (max-width: 820px) {
      .messages {
        padding-top: 14px;
      }

      .messages > * {
        width: 100%;
      }

      .welcome {
        padding-top: 16px;
      }

      .quick-prompts {
        grid-template-columns: 1fr;
      }

      .bubble {
        max-width: min(100%, calc(100vw - 48px));
      }

      .composer-meta {
        font-size: 0.73rem;
      }

      .hint {
        max-width: 52vw;
      }
    }

    @media (max-width: 520px) {
      .chat-header {
        padding-top: calc(8px + var(--safe-top));
        padding-bottom: 8px;
      }

      .header-copy {
        font-size: 0.9rem;
      }

      .icon-btn {
        width: 32px;
        height: 32px;
      }

      .messages {
        padding-inline: max(10px, var(--safe-left)) max(10px, var(--safe-right));
      }

      .composer-wrap {
        padding-inline: max(8px, var(--safe-left)) max(8px, var(--safe-right));
      }

      .composer {
        border-radius: 18px;
      }

      .scroll-btn {
        right: max(12px, var(--safe-right));
      }
    }
  </style>
</head>
<body>
  <main class="chat-shell">
    <header class="chat-header">
      <div class="header-copy">
        <span class="status-dot" aria-hidden="true"></span>
        <span>Sofia</span>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="clearBtn" type="button" title="Καθαρισμός" aria-label="Καθαρισμός συνομιλίας">↺</button>
        <button class="icon-btn" id="minBtn" type="button" title="Ελαχιστοποίηση" aria-label="Ελαχιστοποίηση">−</button>
        <button class="icon-btn" id="closeBtn" type="button" title="Κλείσιμο" aria-label="Κλείσιμο">×</button>
      </div>
    </header>

    <section class="messages-wrap">
      <div class="messages" id="messages" role="log" aria-live="polite" aria-relevant="additions"></div>
      <button id="scrollBtn" class="scroll-btn" type="button" aria-label="Κύλιση στο τέλος">⌄</button>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </section>

    <footer class="composer-wrap">
      <form id="chatForm" class="composer" autocomplete="off">
        <textarea id="chatInput" rows="1" maxlength="500" placeholder="Στείλε μήνυμα στη Sofia" aria-label="Μήνυμα"></textarea>
        <div class="composer-meta">
          <span class="hint">`Enter` αποστολή · `Shift + Enter` νέα γραμμή</span>
          <div class="composer-actions">
            <span id="charCounter" class="counter">0 / 500</span>
            <button id="sendBtn" class="send-btn" type="submit" aria-label="Αποστολή">
              <svg class="send-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M4 12L20 4L16 20L12.5 13.5L4 12Z" fill="currentColor"></path>
              </svg>
              <svg class="stop-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"></rect>
              </svg>
            </button>
          </div>
        </div>
      </form>
    </footer>
  </main>

  <button id="restoreBtn" class="minimized-launcher" type="button" aria-label="Άνοιγμα συνομιλίας">
    <span class="dot" aria-hidden="true"></span>
    <span>Άνοιγμα Sofia</span>
  </button>

  <script>
    const API_ENDPOINT = "/api/chat";
    const STORAGE_KEY = "syn_chat_history_v2";
    const USER_ID_KEY = "sofia_chat_user_id";
    const MAX_CHARS = 500;
    const MAX_STORED_MESSAGES = 80;

    const messagesEl = document.getElementById("messages");
    const formEl = document.getElementById("chatForm");
    const inputEl = document.getElementById("chatInput");
    const sendBtn = document.getElementById("sendBtn");
    const charCounterEl = document.getElementById("charCounter");
    const clearBtn = document.getElementById("clearBtn");
    const minBtn = document.getElementById("minBtn");
    const closeBtn = document.getElementById("closeBtn");
    const restoreBtn = document.getElementById("restoreBtn");
    const scrollBtn = document.getElementById("scrollBtn");
    const toastEl = document.getElementById("toast");

    const quickPrompts = [
      "Τι δικαιολογητικά χρειάζομαι για Vodafone CU φορητότητα;",
      "Ποια είναι τα βήματα για νέο αριθμό NOVA Q;",
      "Πού στέλνω τα δικαιολογητικά και ποια IBAN υπάρχουν;",
      "Πώς ενεργοποιείται η SIM μετά την παραλαβή;"
    ];

    const userId = getOrCreateUserId();
    let messages = [];
    let isSending = false;
    let abortController = null;
    let typingRow = null;

    init();

    function init() {
      setupViewportHeight();
      loadHistory();
      bindEvents();
      autoResizeTextarea();
      updateComposerState();
      requestAnimationFrame(() => scrollToBottom(false));
    }

    function bindEvents() {
      formEl.addEventListener("submit", (event) => {
        event.preventDefault();
        if (isSending) {
          stopCurrentRequest();
          return;
        }
        submitCurrentMessage();
      });

      inputEl.addEventListener("input", () => {
        autoResizeTextarea();
        updateComposerState();
      });

      inputEl.addEventListener("keydown", (event) => {
        if (event.key !== "Enter" || event.shiftKey || event.isComposing) return;
        event.preventDefault();
        if (isSending) {
          stopCurrentRequest();
          return;
        }
        submitCurrentMessage();
      });

      clearBtn.addEventListener("click", clearConversation);
      minBtn.addEventListener("click", minimizeChat);
      closeBtn.addEventListener("click", closeChat);
      restoreBtn.addEventListener("click", restoreChat);
      scrollBtn.addEventListener("click", () => scrollToBottom(true));
      messagesEl.addEventListener("scroll", updateScrollButton);

      window.addEventListener("resize", () => {
        setupViewportHeight();
        scrollToBottom(false);
      });

      window.addEventListener("orientationchange", () => {
        setTimeout(() => {
          setupViewportHeight();
          autoResizeTextarea();
          scrollToBottom(false);
        }, 180);
      });

      if (window.visualViewport) {
        const updateViewport = () => {
          setupViewportHeight();
          scrollToBottom(false);
        };

        window.visualViewport.addEventListener("resize", updateViewport);
        window.visualViewport.addEventListener("scroll", updateViewport);
      }

      window.addEventListener("message", (event) => {
        const type = event.data;
        if (type === "restoreChat") {
          restoreChat(false);
        }
        if (type === "minimizeChat" || type === "closeChat") {
          minimizeChat(false);
        }
      });
    }

    function setupViewportHeight() {
      const height = window.visualViewport?.height || window.innerHeight || document.documentElement.clientHeight;
      document.documentElement.style.setProperty("--visual-height", `${Math.round(height)}px`);
    }

    function loadHistory() {
      const stored = readStorage(STORAGE_KEY);

      if (stored.length === 0) {
        renderWelcome();
        return;
      }

      messages = stored;
      messages.forEach((message) => renderMessage(message.role, message.content, { persist: false, smooth: false }));
    }

    function renderWelcome() {
      const wrapper = document.createElement("div");
      wrapper.className = "welcome";

      const title = document.createElement("h1");
      title.textContent = "Πώς μπορώ να βοηθήσω;";

      const text = document.createElement("p");
      text.textContent = "Ρωτήστε για προσφορές, δικαιολογητικά, IBAN, αποστολή εγγράφων και ενεργοποίηση SIM.";

      const prompts = document.createElement("div");
      prompts.className = "quick-prompts";

      quickPrompts.forEach((prompt) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "prompt-btn";
        button.textContent = prompt;
        button.addEventListener("click", () => {
          if (isSending) return;
          inputEl.value = prompt;
          autoResizeTextarea();
          updateComposerState();
          submitCurrentMessage();
        });
        prompts.appendChild(button);
      });

      wrapper.appendChild(title);
      wrapper.appendChild(text);
      wrapper.appendChild(prompts);
      messagesEl.appendChild(wrapper);
    }

    function clearConversation() {
      messages = [];
      writeStorage(STORAGE_KEY, messages);
      messagesEl.innerHTML = "";
      renderWelcome();
      scrollToBottom(false);
      showToast("Η συνομιλία καθαρίστηκε");
    }

    async function submitCurrentMessage() {
      const content = inputEl.value.trim();
      if (!content || isSending) return;

      if (content.length > MAX_CHARS) {
        showToast("Το μήνυμα είναι πολύ μεγάλο");
        return;
      }

      const welcome = messagesEl.querySelector(".welcome");
      if (welcome) welcome.remove();

      inputEl.value = "";
      autoResizeTextarea();
      updateComposerState();

      await sendMessage(content);

      if (isTouchDevice()) {
        inputEl.blur();
      }
    }

    async function sendMessage(content) {
      addMessage("user", content);
      showTyping();
      setSending(true);
      abortController = new AbortController();

      try {
        const response = await fetch(API_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: content, userId }),
          signal: abortController.signal
        });

        const data = await response.json().catch(() => ({}));
        removeTyping();

        if (!response.ok) {
          addMessage("assistant", data.error || "Προέκυψε σφάλμα. Δοκιμάστε ξανά.");
          return;
        }

        const answer = String(data.answer || data.reply || "Δεν βρέθηκε απάντηση.").trim();
        addMessage("assistant", answer || "Δεν βρέθηκε απάντηση.");
        postToParent("message-sent");
      } catch (error) {
        removeTyping();

        if (error?.name === "AbortError") {
          addTransientAssistant("Η απάντηση διακόπηκε.");
          return;
        }

        addMessage("assistant", "Δεν ήταν δυνατή η σύνδεση. Δοκιμάστε ξανά σε λίγο.");
      } finally {
        abortController = null;
        setSending(false);
        scrollToBottom(true);
      }
    }

    function addMessage(role, content) {
      const message = {
        role,
        content: String(content || "")
      };

      messages.push(message);
      messages = messages.slice(-MAX_STORED_MESSAGES);
      writeStorage(STORAGE_KEY, messages);

      renderMessage(role, content, { persist: false, smooth: true });
    }

    function addTransientAssistant(content) {
      renderMessage("assistant", content, { persist: false, smooth: true });
    }

    function renderMessage(role, content, options = {}) {
      const row = document.createElement("div");
      row.className = `message-row ${role}`;

      if (role === "assistant") {
        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.textContent = "S";
        row.appendChild(avatar);
      }

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      if (role === "assistant") {
        bubble.innerHTML = renderMarkdown(content);
      } else {
        bubble.textContent = String(content || "");
      }

      row.appendChild(bubble);
      messagesEl.appendChild(row);
      scrollToBottom(options.smooth !== false);
    }

    function showTyping() {
      removeTyping();

      const row = document.createElement("div");
      row.className = "message-row assistant";

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = "S";

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      const typing = document.createElement("span");
      typing.className = "typing";
      typing.appendChild(document.createElement("span"));
      typing.appendChild(document.createElement("span"));
      typing.appendChild(document.createElement("span"));

      bubble.appendChild(typing);
      row.appendChild(avatar);
      row.appendChild(bubble);

      typingRow = row;
      messagesEl.appendChild(row);
      scrollToBottom(true);
    }

    function removeTyping() {
      if (!typingRow) return;
      typingRow.remove();
      typingRow = null;
    }

    function setSending(value) {
      isSending = Boolean(value);
      sendBtn.classList.toggle("is-stopping", isSending);
      sendBtn.setAttribute("aria-label", isSending ? "Διακοπή απάντησης" : "Αποστολή");
      updateComposerState();
    }

    function stopCurrentRequest() {
      if (abortController) {
        abortController.abort();
      }
    }

    function autoResizeTextarea() {
      inputEl.style.height = "auto";
      inputEl.style.overflowY = "hidden";
      const maxHeight = isTouchDevice() ? 150 : 220;
      const nextHeight = Math.min(inputEl.scrollHeight, maxHeight);
      inputEl.style.height = `${nextHeight}px`;
      if (inputEl.scrollHeight > maxHeight) {
        inputEl.style.overflowY = "auto";
      }
    }

    function updateComposerState() {
      const length = inputEl.value.length;
      charCounterEl.textContent = `${length} / ${MAX_CHARS}`;
      charCounterEl.classList.toggle("warn", length > MAX_CHARS * 0.9);
      sendBtn.disabled = !isSending && inputEl.value.trim().length === 0;
    }

    function scrollToBottom(smooth = true) {
      requestAnimationFrame(() => {
        messagesEl.scrollTo({
          top: messagesEl.scrollHeight,
          behavior: smooth ? "smooth" : "auto"
        });
        updateScrollButton();
      });
    }

    function updateScrollButton() {
      const distance = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight;
      scrollBtn.classList.toggle("show", distance > 180);
    }

    function minimizeChat(notifyParent = true) {
      inputEl.blur();
      document.body.classList.add("is-minimized");
      if (notifyParent) {
        postToParent("minimizeChat");
      }
    }

    function closeChat(notifyParent = true) {
      inputEl.blur();
      document.body.classList.add("is-minimized");
      if (notifyParent) {
        postToParent("closeChat");
      }
    }

    function restoreChat(notifyParent = true) {
      document.body.classList.remove("is-minimized");
      if (notifyParent) {
        postToParent("restoreChat");
      }
      setupViewportHeight();
      setTimeout(() => {
        scrollToBottom(false);
        if (!isTouchDevice()) {
          inputEl.focus();
        }
      }, 80);
    }

    function renderMarkdown(text) {
      const source = String(text || "").replace(/\r\n?/g, "\n");
      const placeholders = [];

      let html = escapeHtml(source).replace(/```([\s\S]*?)```/g, (_, code) => {
        const token = `@@CODE_${placeholders.length}@@`;
        placeholders.push(`<pre><code>${code.trim()}</code></pre>`);
        return token;
      });

      html = html
        .replace(/`([^`\n]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .replace(/\*([^*]+)\*/g, "<em>$1</em>");

      const lines = html.split("\n");
      const output = [];
      let inUl = false;
      let inOl = false;

      const closeLists = () => {
        if (inUl) {
          output.push("</ul>");
          inUl = false;
        }
        if (inOl) {
          output.push("</ol>");
          inOl = false;
        }
      };

      lines.forEach((rawLine) => {
        const line = rawLine.trim();

        if (!line) {
          closeLists();
          return;
        }

        if (/^[-*]\s+/.test(line)) {
          if (!inUl) {
            if (inOl) {
              output.push("</ol>");
              inOl = false;
            }
            output.push("<ul>");
            inUl = true;
          }
          output.push(`<li>${line.replace(/^[-*]\s+/, "")}</li>`);
          return;
        }

        if (/^\d+\.\s+/.test(line)) {
          if (!inOl) {
            if (inUl) {
              output.push("</ul>");
              inUl = false;
            }
            output.push("<ol>");
            inOl = true;
          }
          output.push(`<li>${line.replace(/^\d+\.\s+/, "")}</li>`);
          return;
        }

        closeLists();
        output.push(`<p>${line}</p>`);
      });

      closeLists();

      let rendered = output.join("");
      placeholders.forEach((fragment, index) => {
        rendered = rendered.replace(`@@CODE_${index}@@`, fragment);
      });

      return rendered || "<p></p>";
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function showToast(message) {
      toastEl.textContent = message;
      toastEl.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toastEl.classList.remove("show"), 1800);
    }

    function isTouchDevice() {
      const isiPadDesktopMode = navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
      const coarsePointer = window.matchMedia?.("(pointer: coarse)")?.matches;
      return Boolean(coarsePointer || isiPadDesktopMode || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent));
    }

    function postToParent(type) {
      try {
        window.parent.postMessage(type, "*");
      } catch (_) {}
    }

    function getOrCreateUserId() {
      try {
        const saved = localStorage.getItem(USER_ID_KEY);
        if (saved && typeof saved === "string" && saved.trim().length > 0) {
          return saved;
        }

        const generated = `u_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 10)}`;
        localStorage.setItem(USER_ID_KEY, generated);
        return generated;
      } catch (_) {
        return `u_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 10)}`;
      }
    }

    function readStorage(key) {
      try {
        const parsed = JSON.parse(localStorage.getItem(key) || "[]");
        if (!Array.isArray(parsed)) return [];

        return parsed
          .filter((item) => {
            const role = item?.role;
            const content = item?.content;
            return (role === "user" || role === "assistant") && typeof content === "string" && content.trim().length > 0;
          })
          .slice(-MAX_STORED_MESSAGES);
      } catch (_) {
        return [];
      }
    }

    function writeStorage(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch (_) {}
    }
  </script>
</body>
</html>
