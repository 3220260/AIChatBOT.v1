<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>Sofia</title>
  <style>
    :root {
      --primary: #12315f;
      --primary-2: #1f6feb;
      --accent: #d21f3c;
      --bg: #f7f8fb;
      --panel: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: rgba(15, 43, 92, 0.12);
      --soft-border: rgba(15, 23, 42, 0.08);
      --shadow: 0 24px 70px rgba(15, 23, 42, 0.16);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
      --visual-height: 100dvh;
    }

    * { box-sizing: border-box; }

    html,
    body {
      height: 100%;
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    button,
    textarea { font: inherit; }

    button { -webkit-tap-highlight-color: transparent; }

    .chat-shell {
      min-height: 100dvh;
      min-height: var(--visual-height);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .chat-window {
      width: min(100%, 460px);
      height: min(780px, calc(var(--visual-height) - 36px));
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .chat-header {
      position: relative;
      padding: 16px 16px 12px;
      background: rgba(255, 255, 255, 0.96);
      color: var(--text);
      border-bottom: 1px solid var(--soft-border);
    }

    .header-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .bot-avatar {
      width: 48px;
      height: 48px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 16px;
      background: #eef4ff;
      border: 1px solid rgba(31, 111, 235, 0.14);
      font-size: 24px;
    }

    .header-copy {
      min-width: 0;
      flex: 1;
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      font-size: 1.05rem;
      font-weight: 900;
      letter-spacing: 0;
    }

    .online-dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: #22c55e;
      box-shadow: 0 0 0 5px rgba(34, 197, 94, 0.18);
    }

    .header-subtitle {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.35;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 999px;
      cursor: pointer;
      color: #334155;
      background: #f1f5f9;
      display: grid;
      place-items: center;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .icon-btn:hover {
      background: #e2e8f0;
      transform: translateY(-1px);
    }

    .suggestion-strip {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      overflow: visible;
      padding: 14px 1px 1px;
    }

    .quick-chip {
      min-width: 0;
      width: 100%;
      border: 1px solid var(--soft-border);
      background: #f8fafc;
      color: #1e293b;
      border-radius: 999px;
      padding: 9px 10px;
      font-weight: 800;
      font-size: 0.74rem;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .quick-chip:hover {
      transform: translateY(-1px);
      background: #eef4ff;
    }

    .messages-wrap {
      position: relative;
      min-height: 0;
      overflow: hidden;
      background: var(--panel);
    }

    .messages {
      height: 100%;
      overflow-y: auto;
      padding: 18px 16px 22px;
      scroll-behavior: smooth;
      overscroll-behavior: contain;
    }

    .messages::-webkit-scrollbar { width: 8px; }

    .messages::-webkit-scrollbar-thumb {
      background: rgba(100, 116, 139, 0.26);
      border-radius: 999px;
    }

    .message-row {
      display: flex;
      gap: 9px;
      margin: 0 0 12px;
      animation: popIn 0.22s ease both;
    }

    .message-row.user { justify-content: flex-end; }

    .mini-avatar {
      width: 30px;
      height: 30px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 11px;
      background: #e0e7ff;
      font-size: 16px;
      margin-top: 4px;
    }

    .bubble {
      max-width: min(82%, 340px);
      border-radius: 18px;
      padding: 12px 13px;
      font-size: 0.92rem;
      line-height: 1.46;
      white-space: pre-wrap;
      word-break: break-word;
      box-shadow: 0 8px 22px rgba(15, 23, 42, 0.08);
    }

    .message-row.bot .bubble {
      background: #f8fafc;
      border: 1px solid var(--soft-border);
      color: #1e293b;
      border-top-left-radius: 8px;
    }

    .message-row.user .bubble {
      background: #1f2937;
      color: #ffffff;
      border-top-right-radius: 8px;
    }

    .bubble-meta {
      display: block;
      margin-top: 7px;
      font-size: 0.7rem;
      color: rgba(100, 116, 139, 0.8);
    }

    .message-row.user .bubble-meta { color: rgba(255, 255, 255, 0.72); }

    .welcome-card {
      background: #ffffff;
      border: 1px solid var(--soft-border);
      border-radius: 8px;
      padding: 14px;
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.07);
      margin-bottom: 12px;
    }

    .welcome-title {
      margin: 0 0 7px;
      font-size: 1rem;
      font-weight: 900;
      color: var(--primary);
    }

    .welcome-text {
      margin: 0 0 12px;
      color: #334155;
      font-size: 0.88rem;
      line-height: 1.45;
    }

    .topic-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .topic-btn {
      border: 1px solid rgba(15, 43, 92, 0.10);
      background: #f8fafc;
      color: #0f172a;
      border-radius: 12px;
      padding: 10px 9px;
      font-size: 0.78rem;
      font-weight: 850;
      cursor: pointer;
      text-align: left;
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }

    .topic-btn:hover {
      transform: translateY(-1px);
      border-color: rgba(37, 99, 235, 0.28);
      background: #eff6ff;
    }

    .typing {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-width: 52px;
    }

    .typing span {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: #94a3b8;
      animation: blink 1.1s infinite ease-in-out;
    }

    .typing span:nth-child(2) { animation-delay: 0.14s; }
    .typing span:nth-child(3) { animation-delay: 0.28s; }

    .composer {
      padding: 12px 14px calc(12px + var(--safe-bottom));
      background: rgba(255, 255, 255, 0.98);
      border-top: 1px solid var(--soft-border);
    }

    .composer-inner {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 8px;
      align-items: end;
      border: 1px solid rgba(15, 43, 92, 0.12);
      border-radius: 24px;
      background: #ffffff;
      padding: 8px 8px 8px 13px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8);
    }

    .input-box { min-width: 0; }

    #chatInput {
      width: 100%;
      min-height: 24px;
      max-height: 96px;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font-size: 0.95rem;
      line-height: 1.35;
      padding: 7px 0;
      overflow-y: auto;
    }

    #chatInput::placeholder { color: #94a3b8; }

    .composer-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 6px;
      padding: 0 3px;
      color: var(--muted);
      font-size: 0.72rem;
    }

    .composer-hint {
      display: none;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .char-counter {
      visibility: hidden;
    }

    .char-counter.warning {
      visibility: visible;
      color: var(--accent);
      font-weight: 800;
    }

    .send-btn,
    .mic-btn {
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 999px;
      color: #ffffff;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .send-btn {
      background: var(--accent);
      box-shadow: 0 10px 22px rgba(210, 31, 60, 0.24);
    }

    .mic-btn {
      display: none;
      background: #f1f5f9;
      color: #334155;
    }

    .mic-btn.is-visible { display: grid; }

    .mic-btn.is-listening {
      color: #ffffff;
      background: var(--primary-2);
    }

    .send-btn:hover { transform: translateY(-1px); }
    .mic-btn:hover { transform: translateY(-1px); }

    .send-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    .send-btn .stop-icon { display: none; }

    .send-btn.is-stopping {
      background: #334155;
      opacity: 1;
    }

    .send-btn.is-stopping .send-icon { display: none; }
    .send-btn.is-stopping .stop-icon { display: block; }

    .toast {
      position: absolute;
      left: 50%;
      bottom: 88px;
      transform: translateX(-50%) translateY(10px);
      max-width: calc(100% - 28px);
      padding: 10px 13px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.92);
      color: #ffffff;
      font-size: 0.78rem;
      font-weight: 800;
      box-shadow: 0 14px 32px rgba(15, 23, 42, 0.24);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s ease;
      z-index: 5;
      text-align: center;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .scroll-bottom-btn {
      position: absolute;
      right: 16px;
      bottom: 16px;
      width: 38px;
      height: 38px;
      border: 1px solid var(--soft-border);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.96);
      color: #334155;
      display: grid;
      place-items: center;
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.12);
      transition: opacity 0.16s ease, transform 0.16s ease;
      z-index: 4;
    }

    .scroll-bottom-btn.show {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }


    .minimized-launcher {
      position: fixed;
      right: max(16px, env(safe-area-inset-right, 0px));
      bottom: max(16px, calc(env(safe-area-inset-bottom, 0px) + 16px));
      z-index: 50;
      display: none;
      align-items: center;
      gap: 11px;
      border: 0;
      border-radius: 999px;
      padding: 12px 15px 12px 12px;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      color: #ffffff;
      cursor: pointer;
      box-shadow: 0 18px 42px rgba(15, 43, 92, 0.32);
      animation: popIn 0.22s ease both;
    }

    .minimized-launcher .launcher-avatar {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.22);
      font-size: 21px;
    }

    .minimized-launcher .launcher-copy {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      line-height: 1.1;
    }

    .minimized-launcher strong {
      font-size: 0.9rem;
      font-weight: 950;
    }

    .minimized-launcher span {
      margin-top: 3px;
      color: rgba(255, 255, 255, 0.76);
      font-size: 0.72rem;
      font-weight: 700;
    }

    body.is-minimized .chat-shell {
      display: block;
      min-height: 0;
      padding: 0;
    }

    body.is-minimized .chat-window {
      display: none;
    }

    body.is-minimized .minimized-launcher {
      display: flex;
    }


    @keyframes popIn {
      from { opacity: 0; transform: translateY(8px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0.35; transform: translateY(0); }
      40% { opacity: 1; transform: translateY(-3px); }
    }

    @media (max-width: 767px) {
      html,
      body {
        background: #ffffff;
      }

      .chat-shell {
        padding: 0;
        align-items: stretch;
        justify-content: stretch;
      }

      .chat-window {
        width: 100%;
        height: var(--visual-height);
        max-height: var(--visual-height);
        border-radius: 0;
        border: 0;
        box-shadow: none;
      }

      .chat-header {
        padding: calc(8px + var(--safe-top)) 10px 8px;
      }

      .bot-avatar {
        width: 36px;
        height: 36px;
        border-radius: 13px;
        font-size: 19px;
      }

      .header-title { font-size: 0.98rem; }
      .header-subtitle { font-size: 0.74rem; }

      .header-row { gap: 9px; }

      .header-actions { gap: 5px; }

      .icon-btn {
        width: 36px;
        height: 36px;
      }

      .suggestion-strip {
        display: flex;
        gap: 7px;
        overflow-x: auto;
        padding: 10px 0 2px;
        scrollbar-width: none;
      }

      .suggestion-strip::-webkit-scrollbar { display: none; }

      .quick-chip {
        flex: 0 0 auto;
        width: auto;
      }

      .messages { padding: 14px 12px 16px; }
      .bubble { max-width: 86vw; }

      .topic-grid {
        grid-template-columns: 1fr 1fr;
        gap: 7px;
      }

      .topic-btn { padding: 10px 8px; }

      .composer {
        padding: 8px 8px calc(8px + var(--safe-bottom));
      }

      .composer-inner {
        border-radius: 24px;
        padding: 7px 7px 7px 12px;
      }

      .composer-footer {
        margin-top: 4px;
      }
    }

    @media (max-width: 380px) {
      .topic-grid { grid-template-columns: 1fr; }
      .quick-chip {
        font-size: 0.68rem;
        padding-inline: 8px;
      }
      .header-actions .icon-btn:first-child { display: none; }
    }

    :root {
      --primary: #0d0d0d;
      --primary-2: #202123;
      --accent: #10a37f;
      --bg: #ffffff;
      --panel: #ffffff;
      --text: #0d0d0d;
      --muted: #6e6e80;
      --border: #d9d9e3;
      --soft-border: #ececf1;
      --user-bubble: #f4f4f4;
      --shadow: none;
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    html,
    body {
      min-height: 100%;
      background: var(--bg);
      -webkit-text-size-adjust: 100%;
      overscroll-behavior: none;
    }

    body {
      position: fixed;
      inset: 0;
      width: 100%;
      overflow: hidden;
    }

    @supports (-webkit-touch-callout: none) {
      html,
      body {
        min-height: -webkit-fill-available;
      }
    }

    button,
    textarea {
      -webkit-appearance: none;
      appearance: none;
    }

    .chat-shell {
      height: 100vh;
      height: var(--visual-height);
      min-height: 0;
      align-items: stretch;
      justify-content: stretch;
      padding: 0;
      background: var(--bg);
    }

    .chat-window {
      width: 100%;
      max-width: none;
      height: var(--visual-height);
      max-height: var(--visual-height);
      border: 0;
      border-radius: 0;
      box-shadow: none;
      background: var(--panel);
    }

    .chat-header {
      z-index: 3;
      padding: calc(10px + var(--safe-top)) max(16px, var(--safe-right)) 8px max(16px, var(--safe-left));
      background: rgba(255, 255, 255, 0.92);
      border-bottom: 1px solid var(--soft-border);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .header-row,
    .suggestion-strip,
    .messages > *,
    .composer-inner {
      max-width: 768px;
      margin-left: auto;
      margin-right: auto;
    }

    .header-row {
      gap: 10px;
      min-height: 40px;
    }

    .bot-avatar {
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 999px;
      background: var(--primary);
      color: #ffffff;
      font-size: 0;
    }

    .bot-avatar::before {
      content: "S";
      font-size: 15px;
      font-weight: 760;
      line-height: 1;
    }

    .header-title {
      gap: 7px;
      font-size: 1rem;
      font-weight: 720;
      color: var(--text);
    }

    .online-dot {
      width: 7px;
      height: 7px;
      background: var(--accent);
      box-shadow: none;
    }

    .header-subtitle {
      color: var(--muted);
      font-size: 0.76rem;
    }

    .header-actions {
      gap: 4px;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      background: transparent;
      color: #5f5f6f;
      font-size: 1.15rem;
      font-weight: 560;
    }

    .icon-btn:hover {
      background: #f4f4f4;
      transform: none;
    }

    .suggestion-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 10px 0 4px;
      scrollbar-width: none;
    }

    .suggestion-strip::-webkit-scrollbar {
      display: none;
    }

    .quick-chip {
      flex: 0 0 auto;
      width: auto;
      border-color: var(--border);
      background: #ffffff;
      color: var(--text);
      padding: 8px 12px;
      font-size: 0.82rem;
      font-weight: 520;
    }

    .quick-chip:hover {
      background: #f7f7f8;
      transform: none;
    }

    .messages-wrap {
      background: #ffffff;
    }

    .messages {
      padding: 28px 18px 32px;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }

    .messages::-webkit-scrollbar {
      width: 7px;
    }

    .messages::-webkit-scrollbar-thumb {
      background: #d9d9e3;
    }

    .message-row {
      gap: 0;
      margin: 0 auto 24px;
      animation: popIn 0.16s ease both;
    }

    .message-row.user {
      justify-content: flex-end;
      padding-left: 48px;
    }

    .message-row.bot {
      justify-content: flex-start;
      padding-right: 16px;
    }

    .mini-avatar {
      display: none;
    }

    .bubble {
      max-width: 100%;
      border-radius: 0;
      padding: 0;
      font-size: 1rem;
      line-height: 1.55;
      box-shadow: none;
    }

    .message-row.bot .bubble {
      background: transparent;
      border: 0;
      color: var(--text);
      border-radius: 0;
    }

    .message-row.user .bubble {
      max-width: min(70%, 620px);
      padding: 10px 16px;
      border-radius: 22px;
      background: var(--user-bubble);
      color: var(--text);
    }

    .bubble-meta {
      color: var(--muted);
    }

    .message-row.user .bubble-meta {
      color: #6e6e80;
    }

    .welcome-card {
      border: 0;
      border-radius: 0;
      padding: 44px 0 14px;
      background: transparent;
      box-shadow: none;
    }

    .welcome-title {
      margin-bottom: 9px;
      color: var(--text);
      font-size: 1.58rem;
      font-weight: 680;
      line-height: 1.2;
    }

    .welcome-text {
      max-width: 620px;
      color: var(--muted);
      font-size: 0.98rem;
      line-height: 1.5;
    }

    .topic-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      max-width: 620px;
    }

    .topic-btn {
      min-height: 54px;
      border-color: var(--border);
      border-radius: 16px;
      background: #ffffff;
      color: var(--text);
      padding: 11px 13px;
      font-size: 0.9rem;
      font-weight: 520;
    }

    .topic-btn:hover {
      border-color: #c7c7d1;
      background: #f7f7f8;
      transform: none;
    }

    .typing span {
      background: #8e8ea0;
    }

    .composer {
      position: relative;
      z-index: 3;
      padding: 10px max(16px, var(--safe-right)) calc(14px + var(--safe-bottom)) max(16px, var(--safe-left));
      border-top: 0;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0), #ffffff 22%);
    }

    .composer-inner {
      min-height: 54px;
      grid-template-columns: 1fr auto auto;
      gap: 6px;
      border: 1px solid #0b2148;
      border-radius: 28px;
      background: #0f2b5c;
      padding: 6px 6px 6px 16px;
      box-shadow: 0 8px 22px rgba(8, 23, 51, 0.28);
    }

    .input-box {
      min-width: 0;
      align-self: end;
    }

    #chatInput {
      min-height: 28px;
      max-height: min(32vh, 180px);
      color: #ffffff;
      caret-color: #ffffff;
      font-size: 16px;
      line-height: 1.5;
      padding: 8px 0;
      -webkit-overflow-scrolling: touch;
    }

    #chatInput::placeholder {
      color: rgba(255, 255, 255, 0.75);
    }

    .composer-footer {
      margin: 0;
      min-height: 0;
      overflow: visible;
      color: rgba(219, 234, 254, 0.88);
    }

    .char-counter {
      line-height: 0;
    }

    .char-counter.warning {
      height: auto;
      line-height: 1.2;
      color: #fde68a;
    }

    .send-btn,
    .mic-btn {
      width: 36px;
      height: 36px;
      align-self: end;
      box-shadow: none;
    }

    .send-btn {
      background: #ffffff;
      color: #0f2b5c;
    }

    .mic-btn {
      background: transparent;
      color: #ffffff;
    }

    .mic-btn.is-listening {
      background: var(--accent);
      color: #ffffff;
    }

    .send-btn:hover,
    .mic-btn:hover {
      transform: none;
    }

    .send-btn:disabled {
      color: #0f2b5c;
      background: rgba(255, 255, 255, 0.5);
      opacity: 1;
    }

    .send-btn.is-stopping {
      background: var(--primary);
    }

    .toast {
      bottom: calc(78px + var(--safe-bottom));
      background: rgba(13, 13, 13, 0.92);
      box-shadow: 0 8px 26px rgba(0, 0, 0, 0.14);
    }

    .scroll-bottom-btn {
      right: max(18px, var(--safe-right));
      bottom: calc(86px + var(--safe-bottom));
      border-color: var(--border);
      background: #ffffff;
      color: var(--text);
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.12);
    }

    .minimized-launcher {
      background: var(--primary);
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.2);
    }

    @media (max-width: 767px) {
      html,
      body,
      .chat-shell,
      .chat-window,
      .messages-wrap,
      .messages {
        width: 100%;
        max-width: 100%;
        overflow-x: hidden;
      }

      .chat-header {
        padding: calc(8px + var(--safe-top)) max(8px, var(--safe-right)) 7px max(8px, var(--safe-left));
        overflow: hidden;
      }

      .header-row {
        max-width: none;
        gap: 8px;
        min-height: 38px;
      }

      .bot-avatar {
        width: 30px;
        height: 30px;
      }

      .bot-avatar::before {
        font-size: 14px;
      }

      .header-title {
        font-size: 0.98rem;
        font-weight: 680;
      }

      .header-subtitle {
        display: none;
      }

      .header-actions {
        gap: 2px;
      }

      .icon-btn {
        width: 34px;
        height: 34px;
      }

      .suggestion-strip {
        max-width: none;
        padding: 8px 0 4px;
      }

      .quick-chip {
        font-size: 0.82rem;
        padding: 8px 11px;
      }

      .messages {
        padding: 20px max(14px, var(--safe-right)) 24px max(14px, var(--safe-left));
      }

      .messages > * {
        width: calc(100vw - 28px);
        max-width: calc(100vw - 28px);
        min-width: 0;
        margin-left: 0;
        margin-right: 0;
      }

      .message-row {
        margin-bottom: 22px;
      }

      .message-row.user {
        padding-left: 36px;
      }

      .message-row.bot {
        padding-right: 4px;
      }

      .message-row.user .bubble {
        max-width: min(82vw, 620px);
      }

      .bubble {
        font-size: 1rem;
      }

      .welcome-card {
        width: calc(100vw - 28px);
        max-width: calc(100vw - 28px);
        min-width: 0;
        padding: 30px 2px 14px;
      }

      .welcome-title {
        font-size: 1.38rem;
      }

      .welcome-text {
        display: none;
      }

      .topic-grid {
        width: calc(100vw - 32px);
        max-width: calc(100vw - 32px);
        min-width: 0;
        grid-template-columns: 1fr;
      }

      .topic-btn {
        width: 100%;
        min-width: 0;
        min-height: 52px;
        padding: 10px 11px;
        font-size: 0.86rem;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .composer {
        padding: 7px max(8px, var(--safe-right)) calc(7px + var(--safe-bottom)) max(8px, var(--safe-left));
      }

      .composer-inner {
        max-width: none;
        min-height: 50px;
        border-radius: 26px;
        padding: 5px 5px 5px 14px;
      }

      #chatInput {
        max-height: 116px;
        padding: 7px 0;
      }

      .send-btn,
      .mic-btn {
        width: 34px;
        height: 34px;
      }
    }

    @media (max-width: 380px) {
      .topic-grid {
        grid-template-columns: 1fr;
      }

      .quick-chip {
        font-size: 0.8rem;
        padding-inline: 10px;
      }

      .header-actions .icon-btn:first-child {
        display: grid;
      }
    }
  </style>
</head>
<body>
  <main class="chat-shell">
    <section class="chat-window" aria-label="Sofia">
      <header class="chat-header" id="chatHeader">
        <div class="header-row">
          <div class="bot-avatar" aria-hidden="true">🤖</div>
          <div class="header-copy">
            <h1 class="header-title"><span>Sofia</span><span class="online-dot" aria-label="Online"></span></h1>
            <p class="header-subtitle">Τηλεφωνία, τηλεόραση & σταθερό internet</p>
          </div>
          <div class="header-actions">
            <button class="icon-btn" type="button" id="minimizeChatBtn" aria-label="Ελαχιστοποίηση συνομιλίας" title="Ελαχιστοποίηση">−</button>
            <button class="icon-btn" type="button" id="clearChatBtn" aria-label="Καθαρισμός συνομιλίας" title="Καθαρισμός">↻</button>
            <button class="icon-btn" type="button" id="closeChatBtn" aria-label="Κλείσιμο συνομιλίας" title="Κλείσιμο">×</button>
          </div>
        </div>

        <div class="suggestion-strip" aria-label="Γρήγορες επιλογές">
          <button class="quick-chip" type="button" data-prompt="Τι δικαιολογητικά χρειάζονται για νέο αριθμό;">Νέος αριθμός</button>
          <button class="quick-chip" type="button" data-prompt="Τι χρειάζεται για φορητότητα;">Φορητότητα</button>
          <button class="quick-chip" type="button" data-prompt="Ποια είναι η προσφορά για σταθερή και internet;">Σταθερή / Internet</button>
          <button class="quick-chip" type="button" data-prompt="Ποια είναι η προσφορά για EON TV;">EON TV</button>
          <button class="quick-chip" type="button" data-prompt="Πώς ενεργοποιείται η SIM;">Ενεργοποίηση SIM</button>
          <button class="quick-chip" type="button" data-prompt="Πού κάνω την κατάθεση των 100 ευρώ;">IBAN</button>
        </div>
      </header>

      <div class="messages-wrap">
        <div class="messages" id="messages" role="log" aria-live="polite" aria-relevant="additions"></div>
        <div class="toast" id="toast" role="status" aria-live="polite"></div>
        <button class="scroll-bottom-btn" type="button" id="scrollBottomBtn" aria-label="Μετάβαση στο τελευταίο μήνυμα" title="Κάτω">⌄</button>
      </div>

      <footer class="composer" id="composer">
        <form class="composer-inner" id="chatForm" autocomplete="off">
          <div class="input-box">
            <textarea
              id="chatInput"
              rows="1"
              maxlength="500"
              inputmode="text"
              placeholder="Ρωτήστε π.χ. «Τι χρειάζεται για Nova Q;»"
              aria-label="Μήνυμα προς τον βοηθό"
            ></textarea>
            <div class="composer-footer">
              <span class="composer-hint"></span>
              <span class="char-counter" id="charCounter">0 / 500</span>
            </div>
          </div>
          <button class="mic-btn" type="button" id="micBtn" aria-label="Φωνητική εισαγωγή" title="Φωνητική εισαγωγή">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
          <button class="send-btn" type="submit" id="sendBtn" aria-label="Αποστολή μηνύματος">
            <svg class="send-icon" width="21" height="21" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M4 12L20 4L16 20L12.5 13.5L4 12Z" fill="currentColor"/>
            </svg>
            <svg class="stop-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="6" y="6" width="12" height="12" rx="2.5" fill="currentColor"/>
            </svg>
          </button>
        </form>
      </footer>
    </section>

    <button class="minimized-launcher" type="button" id="restoreChatBtn" aria-label="Άνοιγμα συνομιλίας">
      <span class="launcher-avatar" aria-hidden="true">🤖</span>
      <span class="launcher-copy">
        <strong>Sofia</strong>
        <span>Πατήστε για άνοιγμα</span>
      </span>
    </button>
  </main>

  <script>
    const API_ENDPOINT = "/api/chat";
    const MAX_CHARS = 500;
    const MOBILE_WIDTH = 768;
    const CHAT_HISTORY_KEY = "verbot_chat_history";
    const MAX_STORED_MESSAGES = 60;

    const messagesEl = document.getElementById("messages");
    const formEl = document.getElementById("chatForm");
    const inputEl = document.getElementById("chatInput");
    const sendBtn = document.getElementById("sendBtn");
    const micBtn = document.getElementById("micBtn");
    const charCounter = document.getElementById("charCounter");
    const toastEl = document.getElementById("toast");
    const scrollBottomBtn = document.getElementById("scrollBottomBtn");
    const clearChatBtn = document.getElementById("clearChatBtn");
    const closeChatBtn = document.getElementById("closeChatBtn");
    const minimizeChatBtn = document.getElementById("minimizeChatBtn");
    const restoreChatBtn = document.getElementById("restoreChatBtn");

    const topicButtons = [
      { label: "📱 Νέος αριθμός", prompt: "Τι δικαιολογητικά χρειάζονται για νέο αριθμό;" },
      { label: "🔁 Φορητότητα", prompt: "Τι χρειάζεται για φορητότητα αριθμού;" },
      { label: "🏠 Σταθερή / Internet", prompt: "Τι χρειάζεται για σταθερή και internet;" },
      { label: "📺 EON TV", prompt: "Ποια είναι η προσφορά για EON TV;" },
      { label: "💳 IBAN / Κατάθεση", prompt: "Πού κάνω την κατάθεση των 100 ευρώ;" },
      { label: "✅ Ενεργοποίηση SIM", prompt: "Πώς ενεργοποιείται η SIM;" }
    ];

    const userId = getOrCreateUserId();
    let isSending = false;
    let typingRow = null;
    let currentAbortController = null;
    let recognition = null;
    let isListening = false;

    initChat();
    bindEvents();
    setupVoiceInput();
    setupVisualViewportFix();

    function initChat() {
      const storedMessages = loadStoredMessages();

      if (storedMessages.length) {
        storedMessages.forEach((item) => addMessage(item.role, item.text, item.meta, { skipSave: true, smooth: false }));
      } else {
        renderWelcome();
      }

      updateComposerState();
      requestAnimationFrame(scrollToBottom);
    }

    function bindEvents() {
      formEl.addEventListener("submit", (event) => {
        event.preventDefault();
        if (isSending) {
          stopCurrentRequest();
          return;
        }
        submitCurrentMessage();
      });

      inputEl.addEventListener("input", () => {
        autoResizeTextarea();
        updateComposerState();
      });

      inputEl.addEventListener("keydown", (event) => {
        if (event.key !== "Enter" || event.shiftKey) return;
        event.preventDefault();
        submitCurrentMessage();
      });

      document.querySelectorAll("[data-prompt]").forEach((button) => {
        button.addEventListener("click", () => sendPrompt(button.dataset.prompt));
      });

      messagesEl.addEventListener("scroll", updateScrollButton);
      scrollBottomBtn.addEventListener("click", () => scrollToBottom());
      micBtn.addEventListener("click", toggleVoiceInput);

      clearChatBtn.addEventListener("click", () => {
        messagesEl.innerHTML = "";
        saveStoredMessages([]);
        renderWelcome();
        scrollToBottom(false);
        showToast("Η συνομιλία καθαρίστηκε");
      });

      minimizeChatBtn.addEventListener("click", minimizeChat);
      restoreChatBtn.addEventListener("click", restoreChat);

      closeChatBtn.addEventListener("click", () => {
        inputEl.blur();
        postToParent("closeChat");
        minimizeChat();
      });

      window.addEventListener("resize", () => {
        setViewportHeight();
        scrollToBottom();
      });

      window.addEventListener("orientationchange", () => {
        setTimeout(() => {
          setViewportHeight();
          autoResizeTextarea();
          scrollToBottom(false);
        }, 220);
      });
    }

    function renderWelcome() {
      const card = document.createElement("div");
      card.className = "welcome-card";

      const title = document.createElement("p");
      title.className = "welcome-title";
      title.textContent = "Γεια σας! Πώς μπορώ να βοηθήσω;";

      const text = document.createElement("p");
      text.className = "welcome-text";
      text.textContent = "Ρωτήστε για κινητή, φορητότητα, σταθερή, internet, EON TV ή IBAN.";

      const grid = document.createElement("div");
      grid.className = "topic-grid";

      topicButtons.forEach((item) => {
        const button = document.createElement("button");
        button.className = "topic-btn";
        button.type = "button";
        button.dataset.welcomePrompt = item.prompt;
        button.textContent = item.label;
        grid.appendChild(button);
      });

      card.appendChild(title);
      card.appendChild(text);
      card.appendChild(grid);
      messagesEl.appendChild(card);

      card.querySelectorAll("[data-welcome-prompt]").forEach((button) => {
        button.addEventListener("click", () => sendPrompt(button.dataset.welcomePrompt));
      });
    }

    async function submitCurrentMessage() {
      const message = inputEl.value.trim();
      if (!message || isSending) return;

      if (message.length > MAX_CHARS) {
        showToast("Το μήνυμα είναι πολύ μεγάλο");
        return;
      }

      inputEl.value = "";
      autoResizeTextarea();
      updateComposerState();

      await sendMessage(message);

      if (isMobile()) {
        inputEl.blur();
      }
    }

    async function sendPrompt(prompt) {
      if (isSending) return;
      inputEl.value = prompt;
      autoResizeTextarea();
      updateComposerState();
      await submitCurrentMessage();
    }

    async function sendMessage(message) {
      addMessage("user", message);
      showTyping();
      setSending(true);
      currentAbortController = new AbortController();

      try {
        const response = await fetch(API_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, userId }),
          signal: currentAbortController.signal
        });

        const data = await response.json().catch(() => ({}));
        removeTyping();

        if (!response.ok) {
          addMessage("bot", data.error || "Παρουσιάστηκε σφάλμα. Δοκιμάστε ξανά σε λίγο.", "Σφάλμα");
          return;
        }

        addMessage("bot", data.reply || "Δεν βρέθηκε απάντηση.", getSourceLabel(data));
        postToParent("message-sent");
      } catch (error) {
        removeTyping();
        if (error.name === "AbortError") {
          addMessage("bot", "Η απάντηση σταμάτησε.", "", { transient: true });
          return;
        }
        addMessage("bot", "Δεν ήταν δυνατή η σύνδεση αυτή τη στιγμή. Δοκιμάστε ξανά σε λίγο.", "Σύνδεση");
      } finally {
        currentAbortController = null;
        setSending(false);
        scrollToBottom();
      }
    }

    function addMessage(role, text, meta = "", options = {}) {
      const row = document.createElement("div");
      row.className = `message-row ${role}`;

      if (role === "bot") {
        const avatar = document.createElement("div");
        avatar.className = "mini-avatar";
        avatar.textContent = "🤖";
        row.appendChild(avatar);
      }

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;

      if (meta) {
        const metaEl = document.createElement("span");
        metaEl.className = "bubble-meta";
        metaEl.textContent = meta;
        bubble.appendChild(metaEl);
      }

      row.appendChild(bubble);
      messagesEl.appendChild(row);
      if (!options.skipSave && !options.transient) {
        persistMessage({ role, text, meta });
      }
      scrollToBottom(options.smooth !== false);
    }

    function showTyping() {
      removeTyping();
      typingRow = document.createElement("div");
      typingRow.className = "message-row bot";

      const avatar = document.createElement("div");
      avatar.className = "mini-avatar";
      avatar.textContent = "🤖";

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      const typing = document.createElement("span");
      typing.className = "typing";
      typing.appendChild(document.createElement("span"));
      typing.appendChild(document.createElement("span"));
      typing.appendChild(document.createElement("span"));

      bubble.appendChild(typing);
      typingRow.appendChild(avatar);
      typingRow.appendChild(bubble);
      messagesEl.appendChild(typingRow);
      scrollToBottom();
    }

    function removeTyping() {
      if (typingRow) {
        typingRow.remove();
        typingRow = null;
      }
    }

    function setSending(value) {
      isSending = value;
      sendBtn.classList.toggle("is-stopping", value);
      sendBtn.setAttribute("aria-label", value ? "Διακοπή απάντησης" : "Αποστολή μηνύματος");
      updateComposerState();
    }

    function updateComposerState() {
      const length = inputEl.value.length;
      charCounter.textContent = `${length} / ${MAX_CHARS}`;
      charCounter.classList.toggle("warning", length > MAX_CHARS * 0.9);
      sendBtn.disabled = !isSending && inputEl.value.trim().length === 0;
      micBtn.disabled = isSending;
    }

    function stopCurrentRequest() {
      if (currentAbortController) {
        currentAbortController.abort();
      }
    }

    function autoResizeTextarea() {
      inputEl.style.height = "auto";
      const maxHeight = isMobile() ? 116 : 180;
      inputEl.style.height = `${Math.min(inputEl.scrollHeight, maxHeight)}px`;
      scrollToBottom(false);
    }

    function scrollToBottom(smooth = true) {
      requestAnimationFrame(() => {
        messagesEl.scrollTo({
          top: messagesEl.scrollHeight,
          behavior: smooth ? "smooth" : "auto"
        });
        updateScrollButton();
      });
    }

    function updateScrollButton() {
      const distanceFromBottom = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight;
      scrollBottomBtn.classList.toggle("show", distanceFromBottom > 160);
    }

    function setupVisualViewportFix() {
      setViewportHeight();

      if (!window.visualViewport) return;

      const update = () => {
        setViewportHeight();
        const keyboardOpen = window.visualViewport.height < window.innerHeight - 80;
        document.body.classList.toggle("is-keyboard-open", keyboardOpen);
        scrollToBottom(false);
      };

      window.visualViewport.addEventListener("resize", update);
      window.visualViewport.addEventListener("scroll", update);
      inputEl.addEventListener("focus", () => setTimeout(update, 80));
      inputEl.addEventListener("blur", () => setTimeout(update, 80));
    }

    function setViewportHeight() {
      const height = window.visualViewport?.height || window.innerHeight || document.documentElement.clientHeight;
      document.documentElement.style.setProperty("--visual-height", `${Math.round(height)}px`);
    }


    function minimizeChat() {
      inputEl.blur();
      document.body.classList.add("is-minimized");
      postToParent("minimizeChat");
    }

    function restoreChat() {
      document.body.classList.remove("is-minimized");
      postToParent("restoreChat");
      setViewportHeight();
      setTimeout(() => {
        scrollToBottom(false);
        if (!isMobile()) {
          inputEl.focus();
        }
      }, 80);
    }

    function setupVoiceInput() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return;

      recognition = new SpeechRecognition();
      recognition.lang = "el-GR";
      recognition.interimResults = true;
      recognition.continuous = false;

      recognition.addEventListener("start", () => {
        isListening = true;
        micBtn.classList.add("is-listening");
      });

      recognition.addEventListener("result", (event) => {
        const transcript = Array.from(event.results)
          .map((result) => result[0]?.transcript || "")
          .join(" ")
          .trim();

        if (transcript) {
          inputEl.value = transcript.slice(0, MAX_CHARS);
          autoResizeTextarea();
          updateComposerState();
        }
      });

      recognition.addEventListener("end", () => {
        isListening = false;
        micBtn.classList.remove("is-listening");
      });

      recognition.addEventListener("error", () => {
        isListening = false;
        micBtn.classList.remove("is-listening");
        showToast("Δεν ενεργοποιήθηκε η φωνητική εισαγωγή");
      });

      micBtn.classList.add("is-visible");
    }

    function toggleVoiceInput() {
      if (!recognition || isSending) return;

      if (isListening) {
        recognition.stop();
        return;
      }

      try {
        recognition.start();
      } catch (_) {}
    }

    function loadStoredMessages() {
      try {
        const parsed = JSON.parse(readStorage(CHAT_HISTORY_KEY) || "[]");
        if (!Array.isArray(parsed)) return [];
        return parsed
          .filter((item) => ["user", "bot"].includes(item.role) && typeof item.text === "string")
          .slice(-MAX_STORED_MESSAGES);
      } catch (_) {
        return [];
      }
    }

    function persistMessage(message) {
      const nextMessages = [...loadStoredMessages(), message].slice(-MAX_STORED_MESSAGES);
      saveStoredMessages(nextMessages);
    }

    function saveStoredMessages(messages) {
      try {
        writeStorage(CHAT_HISTORY_KEY, JSON.stringify(messages));
      } catch (_) {}
    }

    function showToast(message) {
      toastEl.textContent = message;
      toastEl.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toastEl.classList.remove("show"), 1800);
    }

    function getSourceLabel(data) {
      return "";
    }

    function getOrCreateUserId() {
      const key = "verbot_user_id";
      let id = readStorage(key);
      if (!id) {
        id = `u_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 10)}`;
        writeStorage(key, id);
      }
      return id;
    }

    function isMobile() {
      const isiPadDesktopMode = navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
      const hasCoarsePointer = window.matchMedia?.("(pointer: coarse)")?.matches;
      return window.innerWidth < MOBILE_WIDTH || hasCoarsePointer || isiPadDesktopMode || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    }

    function readStorage(key) {
      try {
        return localStorage.getItem(key);
      } catch (_) {
        return "";
      }
    }

    function writeStorage(key, value) {
      try {
        localStorage.setItem(key, value);
      } catch (_) {}
    }

    function postToParent(message) {
      try {
        window.parent.postMessage(message, "*");
      } catch (_) {}
    }

  </script>
</body>
