<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8fafd">
  <title>Sofia</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f8fafd;
      --surface: #ffffff;
      --surface-soft: #f1f4f9;
      --surface-hover: #eaf1fb;
      --surface-blue: #e8f0fe;
      --border: #dde3ee;
      --border-strong: #c9d4e5;
      --text: #1f1f1f;
      --muted: #5f6368;
      --muted-2: #7a8089;
      --blue: #1a73e8;
      --blue-2: #4285f4;
      --red: #ea4335;
      --yellow: #fbbc04;
      --green: #34a853;
      --purple: #8e63e7;
      --shadow: 0 18px 50px rgba(60, 64, 67, 0.14);
      --shadow-soft: 0 8px 28px rgba(60, 64, 67, 0.10);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --visual-height: 100dvh;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(circle at 18% 0%, rgba(66, 133, 244, 0.15), transparent 34%),
        radial-gradient(circle at 88% 8%, rgba(142, 99, 231, 0.13), transparent 34%),
        linear-gradient(180deg, #fbfcff 0%, var(--bg) 46%, #f5f8ff 100%);
      color: var(--text);
      font-family: Inter, "Google Sans", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overscroll-behavior: none;
    }

    body {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }

    button,
    textarea {
      font: inherit;
      color: inherit;
      -webkit-appearance: none;
      appearance: none;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .chat-shell {
      position: relative;
      display: grid;
      grid-template-rows: auto 1fr auto;
      width: 100%;
      height: 100vh;
      height: var(--visual-height);
      overflow: hidden;
    }

    .chat-header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: calc(12px + var(--safe-top)) max(18px, var(--safe-right)) 10px max(18px, var(--safe-left));
      background: rgba(248, 250, 253, 0.74);
      border-bottom: 1px solid rgba(221, 227, 238, 0.62);
      backdrop-filter: blur(18px) saturate(1.1);
      -webkit-backdrop-filter: blur(18px) saturate(1.1);
    }

    .header-copy {
      min-width: 0;
      display: inline-flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      flex: 0 0 auto;
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background:
        linear-gradient(#fff, #fff) padding-box,
        conic-gradient(from 210deg, var(--blue), var(--purple), #d9659f, var(--yellow), var(--green), var(--blue)) border-box;
      border: 1px solid transparent;
      box-shadow: var(--shadow-soft);
      color: var(--blue);
    }

    .brand-mark svg {
      width: 20px;
      height: 20px;
      display: block;
    }

    .brand-text {
      min-width: 0;
      display: grid;
      gap: 2px;
    }

    .brand-title {
      font-size: 1rem;
      line-height: 1.1;
      font-weight: 650;
      letter-spacing: -0.015em;
      color: #202124;
    }

    .brand-subtitle {
      font-size: 0.76rem;
      line-height: 1.2;
      font-weight: 500;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-actions {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex: 0 0 auto;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: #5f6368;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.18s ease, color 0.18s ease, transform 0.18s ease;
    }

    .icon-btn:hover {
      background: rgba(60, 64, 67, 0.08);
      color: #202124;
    }

    .icon-btn:active {
      transform: scale(0.96);
    }

    #closeBtn {
      width: 42px;
      height: 42px;
      border: 1px solid rgba(234, 67, 53, 0.18);
      background: rgba(234, 67, 53, 0.10);
      color: var(--red);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.55),
        0 8px 18px rgba(234, 67, 53, 0.12);
    }

    #closeBtn svg {
      width: 20px;
      height: 20px;
      filter: drop-shadow(0 1px 0 rgba(255, 255, 255, 0.35));
    }

    #closeBtn:hover {
      background: rgba(234, 67, 53, 0.16);
      color: #c5221f;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.62),
        0 10px 22px rgba(234, 67, 53, 0.18);
    }

    #closeBtn:focus-visible {
      outline: 3px solid rgba(234, 67, 53, 0.24);
      outline-offset: 3px;
    }

    .messages-wrap {
      min-height: 0;
      position: relative;
      overflow: hidden;
    }

    .messages {
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 22px max(18px, var(--safe-right)) 22px max(18px, var(--safe-left));
      scroll-behavior: smooth;
    }

    .messages::-webkit-scrollbar {
      width: 10px;
    }

    .messages::-webkit-scrollbar-thumb {
      background: #c8d0dc;
      border-radius: 999px;
      border: 3px solid transparent;
      background-clip: padding-box;
    }

    .messages > * {
      width: min(100%, 920px);
      margin-left: auto;
      margin-right: auto;
    }

    .welcome {
      padding-top: clamp(28px, 8vh, 88px);
      padding-bottom: 18px;
    }

    .welcome-kicker {
      width: max-content;
      max-width: 100%;
      margin: 0 auto 14px;
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid rgba(66, 133, 244, 0.18);
      background: rgba(255, 255, 255, 0.74);
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 560;
      box-shadow: 0 6px 18px rgba(60, 64, 67, 0.06);
    }

    .welcome h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 4.4rem);
      line-height: 1.03;
      font-weight: 720;
      letter-spacing: -0.055em;
      text-align: center;
      background: linear-gradient(90deg, #4285f4 7%, #8e63e7 36%, #d9659f 58%, #fbbc04 81%, #34a853 96%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .welcome p {
      margin: 16px auto 0;
      max-width: 690px;
      font-size: clamp(0.98rem, 2vw, 1.12rem);
      line-height: 1.65;
      color: var(--muted);
      text-align: center;
    }

    .context-card {
      width: min(100%, 690px);
      margin: 0 auto 16px;
      padding: 14px 16px;
      border-radius: 22px;
      border: 1px solid rgba(66, 133, 244, 0.14);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(248, 250, 255, 0.92));
      box-shadow: 0 14px 30px rgba(60, 64, 67, 0.07);
    }

    .context-card-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(66, 133, 244, 0.08);
      color: var(--blue);
      font-size: 0.74rem;
      font-weight: 800;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .context-card-title {
      margin: 0;
      color: var(--text);
      font-size: 1rem;
      font-weight: 760;
      line-height: 1.35;
    }

    .context-card-text {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.93rem;
      line-height: 1.55;
    }

    .context-card-prompts {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .context-card-prompt {
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid rgba(66, 133, 244, 0.14);
      background: rgba(255, 255, 255, 0.96);
      color: var(--blue);
      font-size: 0.82rem;
      font-weight: 700;
    }

    .quick-prompts {
      margin-top: 34px;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .prompt-btn {
      min-height: 112px;
      border: 1px solid rgba(201, 212, 229, 0.78);
      background: rgba(255, 255, 255, 0.78);
      color: #28303a;
      border-radius: 22px;
      padding: 16px;
      text-align: left;
      font-size: 0.92rem;
      line-height: 1.45;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 10px 28px rgba(60, 64, 67, 0.06);
      transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
    }

    .prompt-btn::after {
      content: "✦";
      flex: 0 0 auto;
      width: 26px;
      height: 26px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--surface-blue);
      color: var(--blue);
      font-size: 0.82rem;
    }

    .prompt-btn:hover {
      transform: translateY(-2px);
      border-color: rgba(66, 133, 244, 0.42);
      background: #ffffff;
      box-shadow: var(--shadow-soft);
    }

    .message-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin: 0 auto 24px;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .message-row.assistant {
      justify-content: flex-start;
    }

    .avatar {
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 4px;
      background:
        linear-gradient(#fff, #fff) padding-box,
        conic-gradient(from 210deg, var(--blue), var(--purple), #d9659f, var(--yellow), var(--green), var(--blue)) border-box;
      border: 1px solid transparent;
      box-shadow: 0 6px 18px rgba(66, 133, 244, 0.16);
      color: var(--blue);
    }

    .avatar svg {
      width: 19px;
      height: 19px;
      display: block;
    }

    .bubble {
      max-width: min(760px, calc(100vw - 72px));
      border-radius: 22px;
      padding: 13px 16px;
      font-size: 0.98rem;
      line-height: 1.65;
      white-space: normal;
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    .message-row.user .bubble {
      background: #dfe8fb;
      color: #1f1f1f;
      border-bottom-right-radius: 8px;
      box-shadow: 0 8px 22px rgba(66, 133, 244, 0.10);
    }

    .message-row.assistant .bubble {
      background: rgba(255, 255, 255, 0.72);
      color: var(--text);
      border: 1px solid rgba(221, 227, 238, 0.72);
      border-bottom-left-radius: 8px;
      box-shadow: 0 10px 28px rgba(60, 64, 67, 0.05);
    }

    .bubble p {
      margin: 0;
    }

    .bubble p + p {
      margin-top: 12px;
    }

    .bubble ul,
    .bubble ol {
      margin: 10px 0;
      padding-left: 22px;
    }

    .bubble li + li {
      margin-top: 6px;
    }

    .bubble strong {
      font-weight: 680;
    }

    .bubble code {
      font-family: "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: 0.88em;
      border-radius: 8px;
      background: #eef2f8;
      border: 1px solid #dbe3f0;
      padding: 2px 6px;
    }

    .bubble pre {
      margin: 10px 0;
      padding: 13px;
      overflow: auto;
      border-radius: 14px;
      border: 1px solid #dbe3f0;
      background: #f5f7fb;
    }

    .bubble pre code {
      border: 0;
      background: transparent;
      padding: 0;
    }

    .typing {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 20px;
    }

    .typing span {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--blue);
      animation: geminiPulse 1.05s infinite ease-in-out;
    }

    .typing span:nth-child(2) {
      background: var(--purple);
      animation-delay: 0.14s;
    }

    .typing span:nth-child(3) {
      background: #d9659f;
      animation-delay: 0.28s;
    }

    @keyframes geminiPulse {
      0%,
      100% {
        opacity: 0.32;
        transform: translateY(0) scale(0.9);
      }
      50% {
        opacity: 1;
        transform: translateY(-3px) scale(1.05);
      }
    }

    .scroll-btn {
      position: absolute;
      right: max(18px, var(--safe-right));
      bottom: calc(112px + var(--safe-bottom));
      width: 40px;
      height: 40px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.92);
      color: #3c4043;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      transform: translateY(8px);
      box-shadow: var(--shadow-soft);
      transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s ease;
    }

    .scroll-btn.show {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .composer-wrap {
      position: sticky;
      bottom: 0;
      z-index: 25;
      padding: 18px max(18px, var(--safe-right)) calc(18px + var(--safe-bottom)) max(18px, var(--safe-left));
      background: linear-gradient(180deg, rgba(248, 250, 253, 0) 0%, rgba(248, 250, 253, 0.88) 35%, rgba(248, 250, 253, 0.98) 100%);
    }

    .composer {
      width: min(100%, 920px);
      margin: 0 auto;
      border: 1px solid rgba(201, 212, 229, 0.88);
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.92);
      padding: 10px 12px 10px 18px;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 10px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .composer:focus-within {
      border-color: rgba(66, 133, 244, 0.54);
      box-shadow: 0 18px 50px rgba(66, 133, 244, 0.16);
    }

    #chatInput {
      width: 100%;
      min-height: 40px;
      max-height: min(36vh, 220px);
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: #202124;
      caret-color: var(--blue);
      padding: 9px 0 7px;
      font-size: 16px;
      line-height: 1.45;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      grid-column: 1 / 2;
    }

    #chatInput::placeholder {
      color: #767c85;
    }

    .composer-meta {
      grid-column: 2 / 3;
      display: inline-flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      align-self: end;
      padding-bottom: 1px;
    }

    .counter {
      color: var(--muted-2);
      font-size: 0.74rem;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .counter.warn {
      color: #b06000;
    }

    .send-btn {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--blue), var(--purple));
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.18s ease, opacity 0.18s ease, filter 0.18s ease;
      flex: 0 0 auto;
      box-shadow: 0 10px 24px rgba(66, 133, 244, 0.24);
    }

    .send-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.03);
    }

    .send-btn:active {
      transform: scale(0.96);
    }

    .send-btn:disabled {
      opacity: 0.42;
      cursor: not-allowed;
      transform: none;
      filter: grayscale(0.15);
      box-shadow: none;
    }

    .send-btn .stop-icon {
      display: none;
    }

    .send-btn.is-stopping .send-icon {
      display: none;
    }

    .send-btn.is-stopping .stop-icon {
      display: block;
    }

    .toast {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: calc(112px + var(--safe-bottom));
      z-index: 30;
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid rgba(201, 212, 229, 0.88);
      background: rgba(255, 255, 255, 0.96);
      color: #202124;
      font-size: 0.86rem;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease, visibility 0.2s ease;
      max-width: min(92vw, 560px);
      text-align: center;
      box-shadow: var(--shadow-soft);
    }

    .toast.show {
      opacity: 1;
      visibility: visible;
    }

    .minimized-launcher {
      position: fixed;
      right: max(16px, var(--safe-right));
      bottom: calc(16px + var(--safe-bottom));
      z-index: 40;
      border: 1px solid rgba(201, 212, 229, 0.88);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.94);
      color: #202124;
      padding: 11px 16px 11px 12px;
      display: none;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: var(--shadow);
    }

    .minimized-launcher .dot {
      width: 30px;
      height: 30px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--blue), var(--purple), #d9659f);
      color: #ffffff;
    }

    .minimized-launcher .dot::before {
      content: "✦";
      font-size: 0.86rem;
    }

    body.is-minimized .chat-shell {
      display: none;
    }

    body.is-minimized .minimized-launcher {
      display: inline-flex;
    }

    @media (max-width: 980px) {
      .quick-prompts {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 720px) {
      .chat-header {
        padding-inline: max(14px, var(--safe-left)) max(14px, var(--safe-right));
      }

      .brand-mark {
        width: 34px;
        height: 34px;
        border-radius: 13px;
      }

      .messages {
        padding-top: 14px;
        padding-inline: max(12px, var(--safe-left)) max(12px, var(--safe-right));
      }

      .messages > * {
        width: 100%;
      }

      .welcome {
        padding-top: 28px;
      }

      .welcome h1 {
        text-align: left;
        font-size: clamp(2.45rem, 13vw, 3.6rem);
      }

      .welcome p {
        text-align: left;
      }

      .context-card {
        width: 100%;
        margin-left: 0;
        margin-right: 0;
      }

      .welcome-kicker {
        margin-left: 0;
      }

      .quick-prompts {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .prompt-btn {
        min-height: 76px;
      }

      .bubble {
        max-width: min(100%, calc(100vw - 58px));
      }

      .composer-wrap {
        padding-inline: max(10px, var(--safe-left)) max(10px, var(--safe-right));
        padding-top: 12px;
      }

      .composer {
        border-radius: 26px;
        padding-left: 16px;
      }

      .counter {
        display: none;
      }

      .scroll-btn,
      .toast {
        bottom: calc(104px + var(--safe-bottom));
      }
    }

    @media (max-width: 460px) {
      .header-copy {
        max-width: calc(100vw - 132px);
      }

      .brand-subtitle {
        max-width: 170px;
      }

      .icon-btn {
        width: 34px;
        height: 34px;
      }

      #closeBtn {
        width: 40px;
        height: 40px;
      }

      .messages {
        padding-bottom: 14px;
      }

      .message-row {
        gap: 9px;
        margin-bottom: 20px;
      }

      .avatar {
        width: 30px;
        height: 30px;
      }

      .bubble {
        padding: 12px 14px;
        font-size: 0.95rem;
      }

      .send-btn {
        width: 40px;
        height: 40px;
      }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #131314;
        --surface: #1e1f20;
        --surface-soft: #242528;
        --surface-hover: #2c2d30;
        --surface-blue: #263855;
        --border: #33363d;
        --border-strong: #474b54;
        --text: #e3e3e3;
        --muted: #bdc1c6;
        --muted-2: #9aa0a6;
        --shadow: 0 18px 50px rgba(0, 0, 0, 0.34);
        --shadow-soft: 0 8px 28px rgba(0, 0, 0, 0.22);
      }

      html,
      body {
        background:
          radial-gradient(circle at 18% 0%, rgba(66, 133, 244, 0.22), transparent 34%),
          radial-gradient(circle at 88% 8%, rgba(142, 99, 231, 0.20), transparent 34%),
          linear-gradient(180deg, #161719 0%, #131314 100%);
      }

      .chat-header {
        background: rgba(19, 19, 20, 0.74);
        border-bottom-color: rgba(51, 54, 61, 0.7);
      }

   <span class="dot" aria-hidden="true">🤖</span>
    <span>Άνοιγμα Sofia</span>
  </button>

  <script>
    const API_ENDPOINT = "/api/chat";
    const STORAGE_KEY = "syn_chat_history_v3";
    const USER_ID_KEY = "sofia_chat_user_id";
    const MAX_CHARS = 500;
    const MAX_STORED_MESSAGES = 80;
    
   const ALLOWED_PARENT_ORIGINS = new Set([
  "https://synetairismos-astynomikon.gr",
  "https://www.synetairismos-astynomikon.gr",
  "https://nyxlabs.gr",
  "https://www.nyxlabs.gr",
  "https://3220260.github.io",
  "http://localhost:5500",
  "http://127.0.0.1:5500",
  "http://localhost:3000",
  "http://127.0.0.1:3000",
  "http://localhost:4174",
  "http://127.0.0.1:4174",
  "http://localhost:4175",
  "http://127.0.0.1:4175",
  "http://localhost:5173",
  "http://127.0.0.1:5173"
]);
    const messagesEl = document.getElementById("messages");
    const formEl = document.getElementById("chatForm");
    const inputEl = document.getElementById("chatInput");
    const sendBtn = document.getElementById("sendBtn");
    const charCounterEl = document.getElementById("charCounter");
    const clearBtn = document.getElementById("clearBtn");
    const minBtn = document.getElementById("minBtn");
    const closeBtn = document.getElementById("closeBtn");
    const restoreBtn = document.getElementById("restoreBtn");
    const scrollBtn = document.getElementById("scrollBtn");
    const toastEl = document.getElementById("toast");

    const quickPrompts = [
      "Ποιες προσφορές υπάρχουν;",
      "Τι είναι ο Π.Κ.Σ.Α.Α.;",
      "Πού βρίσκεται ο Συνεταιρισμός;",
      "Ποια είναι τα τηλέφωνα επικοινωνίας;",
      "Τι δικαιολογητικά χρειάζονται;",
      "Πώς κάνω αίτηση;",
      "Πού στέλνω τα έγγραφα;",
      "Έχει προσφορά για internet;"
    ];

    const userId = getOrCreateUserId();
    let messages = [];
    let isSending = false;
    let abortController = null;
    let typingRow = null;
    let activeParentContext = null;

    init();

    function init() {
      setupViewportHeight();
      loadHistory();
      bindEvents();
      autoResizeTextarea();
      updateComposerState();
      requestAnimationFrame(() => scrollToBottom(false));
    }

    function bindEvents() {
      formEl.addEventListener("submit", (event) => {
        event.preventDefault();
        if (isSending) {
          stopCurrentRequest();
          return;
        }
        submitCurrentMessage();
      });

      inputEl.addEventListener("input", () => {
        autoResizeTextarea();
        updateComposerState();
      });

      inputEl.addEventListener("keydown", (event) => {
        if (event.key !== "Enter" || event.shiftKey || event.isComposing) return;
        event.preventDefault();
        if (isSending) {
          stopCurrentRequest();
          return;
        }
        submitCurrentMessage();
      });

      clearBtn.addEventListener("click", clearConversation);
      minBtn.addEventListener("click", minimizeChat);
      closeBtn.addEventListener("click", closeChat);
      restoreBtn.addEventListener("click", restoreChat);
      scrollBtn.addEventListener("click", () => scrollToBottom(true));
      messagesEl.addEventListener("scroll", updateScrollButton);

      window.addEventListener("resize", () => {
        setupViewportHeight();
        scrollToBottom(false);
      });

      window.addEventListener("orientationchange", () => {
        setTimeout(() => {
          setupViewportHeight();
          autoResizeTextarea();
          scrollToBottom(false);
        }, 180);
      });

      if (window.visualViewport) {
        const updateViewport = () => {
          setupViewportHeight();
          scrollToBottom(false);
        };

        window.visualViewport.addEventListener("resize", updateViewport);
        window.visualViewport.addEventListener("scroll", updateViewport);
      }

      window.addEventListener("message", (event) => {
        if (!isAllowedMessageOrigin(event.origin)) return;

        const type = getMessageType(event.data);
        if (type === "restoreChat") {
          restoreChat(false);
        }
        if (type === "minimizeChat" || type === "closeChat") {
          minimizeChat(false);
        }
        if (type === "setContext") {
          setParentContext(event.data?.context || null);
        }
        if (type === "clearContext") {
          clearParentContext();
        }
      });
    }

    function normalizeParentContext(context) {
      if (!context || typeof context !== "object") return null;

      const title = typeof context.title === "string" ? context.title.trim() : "";
      const subtitle = typeof context.subtitle === "string" ? context.subtitle.trim() : "";
      const summary = typeof context.summary === "string" ? context.summary.trim() : "";
      const source = typeof context.source === "string" ? context.source.trim() : "";
      const provider = typeof context.provider === "string" ? context.provider.trim() : "";
      const processType = typeof context.processType === "string" ? context.processType.trim() : "";
      const stepTitle = typeof context.stepTitle === "string" ? context.stepTitle.trim() : "";
      const stepIndex = Number.isFinite(Number(context.stepIndex)) ? Number(context.stepIndex) : null;
      const prompts = Array.isArray(context.prompts)
        ? context.prompts.map((prompt) => String(prompt || "").trim()).filter(Boolean).slice(0, 4)
        : [];

      if (!title && !subtitle && !summary && !prompts.length && !provider && !processType && !stepTitle) {
        return null;
      }

      return {
        title,
        subtitle,
        summary,
        source,
        provider,
        processType,
        stepTitle,
        stepIndex,
        prompts,
      };
    }

    function setParentContext(context) {
      const normalized = normalizeParentContext(context);
      activeParentContext = normalized;
      if (messages.length === 0) {
        messagesEl.innerHTML = "";
        if (activeParentContext) {
          renderContextCard();
        }
        renderWelcome();
        scrollToBottom(false);
        return;
      }
      renderContextCard();
    }

    function clearParentContext() {
      activeParentContext = null;
      if (messages.length === 0) {
        messagesEl.innerHTML = "";
        renderWelcome();
        scrollToBottom(false);
        return;
      }
      renderContextCard();
    }

    function getActiveQuickPrompts() {
      if (!activeParentContext?.prompts?.length) return quickPrompts;

      const merged = [...activeParentContext.prompts, ...quickPrompts];
      return [...new Set(merged)];
    }

    function renderContextCard() {
      const existing = messagesEl.querySelector("[data-parent-context-card='true']");
      if (existing) existing.remove();
      if (!activeParentContext) return;

      const card = document.createElement("div");
      card.className = "context-card";
      card.dataset.parentContextCard = "true";

      const badge = document.createElement("div");
      badge.className = "context-card-badge";
      badge.textContent = "Πλαίσιο συνομιλίας";

      const title = document.createElement("p");
      title.className = "context-card-title";
      title.textContent = activeParentContext.title || "Πλαίσιο από την κάρτα";

      const text = document.createElement("p");
      text.className = "context-card-text";
      text.textContent = activeParentContext.summary || "Μπορώ να βοηθήσω με ό,τι αφορά το σημείο από όπου άνοιξες το chat.";

      card.appendChild(badge);
      card.appendChild(title);
      card.appendChild(text);

      if (activeParentContext.prompts.length) {
        const prompts = document.createElement("div");
        prompts.className = "context-card-prompts";

        activeParentContext.prompts.forEach((prompt) => {
          const promptChip = document.createElement("button");
          promptChip.type = "button";
          promptChip.className = "context-card-prompt";
          promptChip.textContent = prompt;
          promptChip.addEventListener("click", () => {
            if (isSending) return;
            inputEl.value = prompt;
            autoResizeTextarea();
            updateComposerState();
            submitCurrentMessage();
          });
          prompts.appendChild(promptChip);
        });

        card.appendChild(prompts);
      }

      messagesEl.prepend(card);
    }

    function setupViewportHeight() {
      const height = window.visualViewport?.height || window.innerHeight || document.documentElement.clientHeight;
      document.documentElement.style.setProperty("--visual-height", `${Math.round(height)}px`);
    }

    function loadHistory() {
      const stored = readStorage(STORAGE_KEY);

      if (stored.length === 0) {
        renderWelcome();
        return;
      }

      messages = stored;
      messages.forEach((message) => renderMessage(message.role, message.content, { smooth: false }));
    }

    function renderWelcome() {
      const wrapper = document.createElement("div");
      wrapper.className = "welcome";

      const kicker = document.createElement("div");
      kicker.className = "welcome-kicker";
      kicker.textContent = activeParentContext ? "Sofia AI assistant · Πλαίσιο καρτέλας" : "Sofia AI assistant";

      const title = document.createElement("h1");
      title.textContent = activeParentContext?.title ? `Πώς μπορώ να βοηθήσω για ${activeParentContext.title};` : "Πώς μπορώ να βοηθήσω;";

      const text = document.createElement("p");
      text.textContent = activeParentContext?.summary
        || "Γεια σας, είμαι η Sofia. Μπορώ να βοηθήσω με προσφορές, δικαιολογητικά, διαδικασίες και στοιχεία επικοινωνίας του Π.Κ.Σ.Α.Α.";

      const prompts = document.createElement("div");
      prompts.className = "quick-prompts";

      getActiveQuickPrompts().forEach((prompt) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "prompt-btn";
        button.textContent = prompt;
        button.addEventListener("click", () => {
          if (isSending) return;
          inputEl.value = prompt;
          autoResizeTextarea();
          updateComposerState();
          submitCurrentMessage();
        });
        prompts.appendChild(button);
      });

      wrapper.appendChild(kicker);
      wrapper.appendChild(title);
      wrapper.appendChild(text);
      wrapper.appendChild(prompts);
      messagesEl.appendChild(wrapper);
    }

    function clearConversation() {
      messages = [];
      writeStorage(STORAGE_KEY, messages);
      messagesEl.innerHTML = "";
      if (activeParentContext) {
        renderContextCard();
      }
      renderWelcome();
      scrollToBottom(false);
      showToast("Η συνομιλία καθαρίστηκε");
    }

    async function submitCurrentMessage() {
      const content = inputEl.value.trim();
      if (!content || isSending) return;

      if (content.length > MAX_CHARS) {
        showToast("Το μήνυμα είναι πολύ μεγάλο");
        return;
      }

      const welcome = messagesEl.querySelector(".welcome");
      if (welcome) welcome.remove();

      inputEl.value = "";
      autoResizeTextarea();
      updateComposerState();

      await sendMessage(content);

      if (isTouchDevice()) {
        inputEl.blur();
      }
    }

    async function sendMessage(content) {
      addMessage("user", content);
      showTyping();
      setSending(true);
      abortController = new AbortController();

      try {
        const response = await fetch(API_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: content, userId, context: activeParentContext }),
          signal: abortController.signal
        });

        const data = await response.json().catch(() => ({}));
        removeTyping();

        if (!response.ok) {
          addMessage("assistant", data.error || "Προέκυψε σφάλμα. Δοκιμάστε ξανά.");
          return;
        }

        const answer = String(data.answer || data.reply || "Δεν βρέθηκε απάντηση.").trim();
        addMessage("assistant", answer || "Δεν βρέθηκε απάντηση.");
        postToParent("message-sent");
      } catch (error) {
        removeTyping();

        if (error?.name === "AbortError") {
          addTransientAssistant("Η απάντηση διακόπηκε.");
          return;
        }

        addMessage("assistant", "Δεν ήταν δυνατή η σύνδεση. Δοκιμάστε ξανά σε λίγο.");
      } finally {
        abortController = null;
        setSending(false);
        scrollToBottom(true);
      }
    }

    function addMessage(role, content) {
      const message = {
        role,
        content: String(content || "")
      };

      messages.push(message);
      messages = messages.slice(-MAX_STORED_MESSAGES);
      writeStorage(STORAGE_KEY, messages);

      renderMessage(role, content, { smooth: true });
    }

    function addTransientAssistant(content) {
      renderMessage("assistant", content, { smooth: true });
    }

    function renderMessage(role, content, options = {}) {
      const row = document.createElement("div");
      row.className = `message-row ${role}`;

      if (role === "assistant") {
        row.appendChild(createAssistantAvatar());
      }

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      if (role === "assistant") {
        bubble.innerHTML = renderMarkdown(content);
      } else {
        bubble.textContent = String(content || "");
      }

      row.appendChild(bubble);
      messagesEl.appendChild(row);
      scrollToBottom(options.smooth !== false);
    }

  function createAssistantAvatar() {
  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.setAttribute("aria-hidden", "true");
  avatar.innerHTML = `
    <svg viewBox="0 0 24 24" fill="none">
      <rect x="5" y="7" width="14" height="11" rx="4" fill="currentColor" opacity="0.18"></rect>
      <rect x="6.5" y="8.5" width="11" height="8" rx="3.2" stroke="currentColor" stroke-width="1.8"></rect>
      <circle cx="10.2" cy="12.5" r="1.15" fill="currentColor"></circle>
      <circle cx="13.8" cy="12.5" r="1.15" fill="currentColor"></circle>
      <path d="M10 15c.5.38 1.14.6 2 .6.86 0 1.5-.22 2-.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path>
      <path d="M12 4.2v2.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
      <circle cx="12" cy="3.2" r="1.1" fill="currentColor"></circle>
      <path d="M6.1 12.2H4.9M19.1 12.2h-1.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path>
    </svg>
  `;
  return avatar;
}

    function showTyping() {
      removeTyping();

      const row = document.createElement("div");
      row.className = "message-row assistant";

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      const typing = document.createElement("span");
      typing.className = "typing";
      typing.appendChild(document.createElement("span"));
      typing.appendChild(document.createElement("span"));
      typing.appendChild(document.createElement("span"));

      bubble.appendChild(typing);
      row.appendChild(createAssistantAvatar());
      row.appendChild(bubble);

      typingRow = row;
      messagesEl.appendChild(row);
      scrollToBottom(true);
    }

    function removeTyping() {
      if (!typingRow) return;
      typingRow.remove();
      typingRow = null;
    }

    function setSending(value) {
      isSending = Boolean(value);
      sendBtn.classList.toggle("is-stopping", isSending);
      sendBtn.setAttribute("aria-label", isSending ? "Διακοπή απάντησης" : "Αποστολή");
      updateComposerState();
    }

    function stopCurrentRequest() {
      if (abortController) {
        abortController.abort();
      }
    }

    function autoResizeTextarea() {
      inputEl.style.height = "auto";
      inputEl.style.overflowY = "hidden";
      const maxHeight = isTouchDevice() ? 150 : 220;
      const nextHeight = Math.min(inputEl.scrollHeight, maxHeight);
      inputEl.style.height = `${nextHeight}px`;
      if (inputEl.scrollHeight > maxHeight) {
        inputEl.style.overflowY = "auto";
      }
    }

    function updateComposerState() {
      const length = inputEl.value.length;
      charCounterEl.textContent = `${length} / ${MAX_CHARS}`;
      charCounterEl.classList.toggle("warn", length > MAX_CHARS * 0.9);
      sendBtn.disabled = !isSending && inputEl.value.trim().length === 0;
    }

    function scrollToBottom(smooth = true) {
      requestAnimationFrame(() => {
        messagesEl.scrollTo({
          top: messagesEl.scrollHeight,
          behavior: smooth ? "smooth" : "auto"
        });
        updateScrollButton();
      });
    }

    function updateScrollButton() {
      const distance = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight;
      scrollBtn.classList.toggle("show", distance > 180);
    }

    function minimizeChat(notifyParent = true) {
      inputEl.blur();
      document.body.classList.add("is-minimized");
      if (notifyParent) {
        postToParent("minimizeChat");
      }
    }

    function closeChat(notifyParent = true) {
      inputEl.blur();
      document.body.classList.add("is-minimized");

      if (notifyParent) {
        postToParent("PKSAA_CHAT_CLOSE");
        postToParent("closeChat");
      }
    }

    function restoreChat(notifyParent = true) {
      document.body.classList.remove("is-minimized");
      if (notifyParent) {
        postToParent("restoreChat");
      }
      setupViewportHeight();
      setTimeout(() => {
        scrollToBottom(false);
        if (!isTouchDevice()) {
          inputEl.focus();
        }
      }, 80);
    }

    function renderMarkdown(text) {
      const source = String(text || "").replace(/\r\n?/g, "\n");
      const placeholders = [];

      let html = escapeHtml(source).replace(/```([\s\S]*?)```/g, (_, code) => {
        const token = `@@CODE_${placeholders.length}@@`;
        placeholders.push(`<pre><code>${code.trim()}</code></pre>`);
        return token;
      });

      html = html
        .replace(/`([^`\n]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .replace(/\*([^*]+)\*/g, "<em>$1</em>");

      const lines = html.split("\n");
      const output = [];
      let inUl = false;
      let inOl = false;

      const closeLists = () => {
        if (inUl) {
          output.push("</ul>");
          inUl = false;
        }
        if (inOl) {
          output.push("</ol>");
          inOl = false;
        }
      };

      lines.forEach((rawLine) => {
        const line = rawLine.trim();

        if (!line) {
          closeLists();
          return;
        }

        if (/^[-*]\s+/.test(line)) {
          if (!inUl) {
            if (inOl) {
              output.push("</ol>");
              inOl = false;
            }
            output.push("<ul>");
            inUl = true;
          }
          output.push(`<li>${line.replace(/^[-*]\s+/, "")}</li>`);
          return;
        }

        if (/^\d+\.\s+/.test(line)) {
          if (!inOl) {
            if (inUl) {
              output.push("</ul>");
              inUl = false;
            }
            output.push("<ol>");
            inOl = true;
          }
          output.push(`<li>${line.replace(/^\d+\.\s+/, "")}</li>`);
          return;
        }

        closeLists();
        output.push(`<p>${line}</p>`);
      });

      closeLists();

      let rendered = output.join("");
      placeholders.forEach((fragment, index) => {
        rendered = rendered.replace(`@@CODE_${index}@@`, fragment);
      });

      return rendered || "<p></p>";
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function showToast(message) {
      toastEl.textContent = message;
      toastEl.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toastEl.classList.remove("show"), 1800);
    }

    function isTouchDevice() {
      const isiPadDesktopMode = navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
      const coarsePointer = window.matchMedia?.("(pointer: coarse)")?.matches;
      return Boolean(coarsePointer || isiPadDesktopMode || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent));
    }

    function postToParent(type) {
      try {
        if (window.parent === window) return;
        const targetOrigin = getParentTargetOrigin();
        const payload = { source: "sofia-chat", type };
        if (targetOrigin) {
          window.parent.postMessage(payload, targetOrigin);
          return;
        }
        window.parent.postMessage(payload, "*");
      } catch (_) {}
    }

    function getMessageType(data) {
      if (typeof data === "string") return data;
      if (data && typeof data.type === "string") return data.type;
      return "";
    }

    function isAllowedMessageOrigin(origin) {
      if (!origin || origin === window.location.origin) return true;
      return ALLOWED_PARENT_ORIGINS.has(origin);
    }

    function getRequestedParentOrigin() {
      try {
        const parentOrigin = new URLSearchParams(window.location.search).get("parentOrigin")?.trim();
        if (parentOrigin) {
          const normalizedOrigin = new URL(parentOrigin).origin;
          if (ALLOWED_PARENT_ORIGINS.has(normalizedOrigin)) return normalizedOrigin;
        }
      } catch (_) {}
      return "";
    }

    function getParentTargetOrigin() {
      const requestedParentOrigin = getRequestedParentOrigin();
      if (requestedParentOrigin) return requestedParentOrigin;
      try {
        const referrerOrigin = document.referrer ? new URL(document.referrer).origin : "";
        if (ALLOWED_PARENT_ORIGINS.has(referrerOrigin)) return referrerOrigin;
        if (ALLOWED_PARENT_ORIGINS.has(window.location.origin)) return window.location.origin;
      } catch (_) {}
      return "";
    }

    function getOrCreateUserId() {
      try {
        const saved = localStorage.getItem(USER_ID_KEY);
        if (saved && typeof saved === "string" && saved.trim().length > 0) {
          return saved;
        }

        const generated = `u_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 10)}`;
        localStorage.setItem(USER_ID_KEY, generated);
        return generated;
      } catch (_) {
        return `u_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 10)}`;
      }
    }

    function readStorage(key) {
      try {
        const parsed = JSON.parse(localStorage.getItem(key) || "[]");
        if (!Array.isArray(parsed)) return [];

        return parsed
          .filter((item) => {
            const role = item?.role;
            const content = item?.content;
            return (role === "user" || role === "assistant") && typeof content === "string" && content.trim().length > 0;
          })
          .slice(-MAX_STORED_MESSAGES);
      } catch (_) {
        return [];
      }
    }

    function writeStorage(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch (_) {}
    }
  </script>
</body>
