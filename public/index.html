<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8fafd">
  <title>Sofia</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="chat-shell">
    <header class="chat-header">
      <div class="header-copy">
       <span class="brand-mark" aria-hidden="true">
  <svg viewBox="0 0 24 24" fill="none">
    <rect x="5" y="7" width="14" height="11" rx="4" fill="currentColor" opacity="0.18"></rect>
    <rect x="6.5" y="8.5" width="11" height="8" rx="3.2" stroke="currentColor" stroke-width="1.8"></rect>
    <circle cx="10.2" cy="12.5" r="1.15" fill="currentColor"></circle>
    <circle cx="13.8" cy="12.5" r="1.15" fill="currentColor"></circle>
    <path d="M10 15c.5.38 1.14.6 2 .6.86 0 1.5-.22 2-.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path>
    <path d="M12 4.2v2.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
    <circle cx="12" cy="3.2" r="1.1" fill="currentColor"></circle>
    <path d="M6.1 12.2H4.9M19.1 12.2h-1.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path>
  </svg>
</span>
        <span class="brand-text">
          <span class="brand-title">Sofia</span>
          <span class="brand-subtitle">Ψηφιακή βοηθός Π.Κ.Σ.Α.Α.</span>
        </span>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="clearBtn" type="button" title="Καθαρισμός" aria-label="Καθαρισμός συνομιλίας">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 7V4H1" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
            <path d="M4.7 4.7A9 9 0 1 1 3 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
          </svg>
        </button>
        <button class="icon-btn" id="minBtn" type="button" title="Ελαχιστοποίηση" aria-label="Ελαχιστοποίηση">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M6 12H18" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
          </svg>
        </button>
        <button class="icon-btn" id="closeBtn" type="button" title="Κλείσιμο" aria-label="Κλείσιμο">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M7 7L17 17M17 7L7 17" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
          </svg>
        </button>
      </div>
    </header>

    <section class="messages-wrap">
      <div class="messages" id="messages" role="log" aria-live="polite" aria-relevant="additions"></div>
      <button id="scrollBtn" class="scroll-btn" type="button" aria-label="Κύλιση στο τέλος">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
      </button>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </section>

    <footer class="composer-wrap">
      <form id="chatForm" class="composer" autocomplete="off">
        <textarea id="chatInput" rows="1" maxlength="500" placeholder="Ρώτησε τη Sofia..." aria-label="Μήνυμα"></textarea>
        <div class="composer-meta">
          <span id="charCounter" class="counter">0 / 500</span>
          <button id="sendBtn" class="send-btn" type="submit" aria-label="Αποστολή">
            <svg class="send-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M5 12h12.2M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
            <svg class="stop-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="6" y="6" width="12" height="12" rx="2.4" fill="currentColor"></rect>
            </svg>
          </button>
        </div>
      </form>
    </footer>
  </main>

  <button id="restoreBtn" class="minimized-launcher" type="button" aria-label="Άνοιγμα συνομιλίας">
   <span class="dot" aria-hidden="true">🤖</span>
    <span>Άνοιγμα Sofia</span>
  </button>

  <script src="/chat.js" defer></script>
</body>
</html>
